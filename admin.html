<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Painel do Admin - WCCollection</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #1a1e29; color: #dddddd; padding: 20px; }
    
    h1, h2 { color: #f39c12; margin-bottom: 15px; }
    .container { max-width: 1000px; margin: 0 auto; background: #161b26; padding: 24px; border-radius: 12px; border: 1px solid #333d52; }
    
    .form-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(220px, 1fr)); gap: 16px; margin-bottom: 20px; }
    .form-group { display: flex; flex-direction: column; gap: 6px; }
    label { font-size: 0.85rem; font-weight: bold; color: #f39c12; text-transform: uppercase; }
    input[type="text"], input[type="number"], select { padding: 10px; background: #11141d; border: 1px solid #333d52; border-radius: 6px; color: #fff; }
    
    .file-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 12px; margin-bottom: 20px; }
    .file-card { background: #11141d; border: 1px solid #333d52; padding: 10px; border-radius: 8px; text-align: center; }
    .file-card input { margin-top: 8px; width: 100%; font-size: 0.8rem; color: #a0aec0; }
    
    .checkbox-group { display: flex; gap: 20px; align-items: center; margin-bottom: 20px; }
    .checkbox-group label { display: flex; align-items: center; gap: 8px; cursor: pointer; color: #fff; }

    .btn-container { display: flex; gap: 12px; margin-bottom: 20px; }
    button { padding: 12px 24px; border-radius: 8px; font-weight: bold; border: none; cursor: pointer; text-transform: uppercase; transition: all 0.2s; }
    .btn-save { background: #f39c12; color: #1a1f2c; }
    .btn-save:hover { background: #e67e22; }
    .btn-cancel { background: #333d52; color: #fff; }
    
    .status-msg { padding: 12px; border-radius: 8px; margin-bottom: 20px; font-weight: bold; display: none; }
    .status-msg.error { background: rgba(231, 76, 60, 0.2); border: 1px solid #e74c3c; color: #e74c3c; display: block; }
    .status-msg.success { background: rgba(46, 204, 113, 0.2); border: 1px solid #2ecc71; color: #2ecc71; display: block; }

    table { width: 100%; border-collapse: collapse; margin-top: 20px; }
    th, td { padding: 12px; text-align: left; border-bottom: 1px solid #2a3447; font-size: 0.85rem; }
    th { background: #11141d; color: #f39c12; text-transform: uppercase; }
    .badge { padding: 3px 8px; border-radius: 4px; font-size: 0.75rem; font-weight: bold; }
    .badge-lata { background: #2980b9; color: #fff; }
    .badge-ococ { background: #27ae60; color: #fff; }
    .badge-set { background: #8e44ad; color: #fff; }
    
    .btn-action { padding: 6px 12px; font-size: 0.75rem; margin-right: 4px; }
    .btn-edit { background: #f39c12; color: #1a1f2c; }
    .btn-delete { background: #e74c3c; color: #fff; }
  </style>
</head>
<body>

  <div class="container">
    <h1>PAINEL DE CADASTRO DE LATAS</h1>
    
    <div id="statusMsg" class="status-msg"></div>

    <form id="lataForm" onsubmit="handleFormSubmit(event)">
      <input type="hidden" id="editRowId" value="">

      <div class="form-grid">
        <div class="form-group">
          <label for="inputNome">Nome da Lata / Edição</label>
          <input type="text" id="inputNome" required placeholder="Ex: Live Schmeckt's Am Besten">
        </div>
        <div class="form-group">
          <label for="inputCervejaria">Cervejaria / Marca</label>
          <input type="text" id="inputCervejaria" required placeholder="Ex: Heineken">
        </div>
        <div class="form-group">
          <label for="inputPais">País de Origem</label>
          <input type="text" id="inputPais" required placeholder="Ex: Suíça">
        </div>
        <div class="form-group">
          <label for="inputVolume">Volume</label>
          <input type="text" id="inputVolume" placeholder="Ex: 500 ML">
        </div>
        <div class="form-group">
          <label for="inputAno">Ano</label>
          <input type="number" id="inputAno" placeholder="Ex: 2024">
        </div>
        <div class="form-group">
          <label for="inputBarcode">Código de Barras</label>
          <input type="text" id="inputBarcode" placeholder="Ex: 7610055020750">
        </div>
      </div>

      <div class="checkbox-group">
        <label><input type="checkbox" id="checkOcoc"> É OCOC (Países)</label>
        <label><input type="checkbox" id="checkSet"> É SET / PACK</label>
      </div>

      <label>IMAGENS DO ITEM (ENVIO DIRETO PARA O GOOGLE DRIVE)</label>
      <div class="file-grid">
        <div class="file-card"><label>Logo da Marca</label><input type="file" id="fileLogo" accept="image/*"></div>
        <div class="file-card"><label>Foto da Capa (Cover)</label><input type="file" id="fileCover" accept="image/*"></div>
        <div class="file-card"><label>Foto Frente (Front)</label><input type="file" id="fileFront" accept="image/*"></div>
        <div class="file-card"><label>Foto Esquerda (Left)</label><input type="file" id="fileLeft" accept="image/*"></div>
        <div class="file-card"><label>Foto Verso (Back)</label><input type="file" id="fileBack" accept="image/*"></div>
        <div class="file-card"><label>Foto Direita (Right)</label><input type="file" id="fileRight" accept="image/*"></div>
      </div>

      <div class="btn-container">
        <button type="submit" class="btn-save" id="btnSave">SALVAR ITEM</button>
        <button type="button" class="btn-cancel" onclick="resetForm()">CANCELAR / LIMPAR</button>
      </div>
    </form>

    <h2>ITENS CADASTRADOS NO CATÁLOGO</h2>
    <table>
      <thead>
        <tr>
          <th>ID</th>
          <th>Tipo</th>
          <th>Nome</th>
          <th>Cervejaria</th>
          <th>País</th>
          <th>Volume</th>
          <th>Ações</th>
        </tr>
      </thead>
      <tbody id="catalogTableBody">
        <tr><td colspan="7" style="text-align:center;">Carregando itens...</td></tr>
      </tbody>
    </table>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwFIsSgEF2grkBpliyO_hSD0Lh2ULq6xHoJC6mDLYvjemTLYe67jF38MDNWP2ixITzE/exec";
  let fullCatalog = [];

  function showStatus(msg, isSuccess) {
    const el = document.getElementById("statusMsg");
    el.innerText = msg;
    el.className = `status-msg ${isSuccess ? 'success' : 'error'}`;
    setTimeout(() => { el.style.display = 'none'; }, 6000);
  }

  function fileToBase64(fileInput) {
    return new Promise((resolve) => {
      if (!fileInput || !fileInput.files || fileInput.files.length === 0) {
        resolve("");
        return;
      }
      const reader = new FileReader();
      reader.onload = () => resolve(reader.result);
      reader.onerror = () => resolve("");
      reader.readAsDataURL(fileInput.files[0]);
    });
  }

  async function handleFormSubmit(e) {
    e.preventDefault();
    const btnSave = document.getElementById("btnSave");
    btnSave.innerText = "ENVIANDO IMAGENS...";
    btnSave.disabled = true;

    try {
      const editRowId = document.getElementById("editRowId").value;
      const action = editRowId ? "edit" : "save";

      const payload = {
        action: action,
        _rowId: editRowId,
        Nome: document.getElementById("inputNome").value,
        Cervejaria: document.getElementById("inputCervejaria").value,
        Pais: document.getElementById("inputPais").value,
        Volume: document.getElementById("inputVolume").value,
        Ano: document.getElementById("inputAno").value,
        Barcode: document.getElementById("inputBarcode").value,
        isOcoc: document.getElementById("checkOcoc").checked,
        isSet: document.getElementById("checkSet").checked,

        // Converte as fotos em Base64 para envio seguro
        BRAND_LOGO: await fileToBase64(document.getElementById("fileLogo")),
        ImgCover: await fileToBase64(document.getElementById("fileCover")),
        ImgFront: await fileToBase64(document.getElementById("fileFront")),
        ImgLeft: await fileToBase64(document.getElementById("fileLeft")),
        ImgBack: await fileToBase64(document.getElementById("fileBack")),
        ImgRight: await fileToBase64(document.getElementById("fileRight"))
      };

      const response = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify(payload)
      });

      const res = await response.json();

      if (res.success) {
        showStatus(res.message || "Item e fotos salvos com sucesso no Google Drive!", true);
        resetForm();
        loadCatalogTable();
      } else {
        showStatus("Erro: " + (res.error || "Não foi possível salvar os dados."), false);
      }
    } catch (err) {
      console.error(err);
      showStatus("Erro ao comunicar com o servidor. Tente novamente.", false);
    } finally {
      btnSave.innerText = "SALVAR ITEM";
      btnSave.disabled = false;
    }
  }

  async function loadCatalogTable() {
    try {
      const response = await fetch(API_URL + "?nocache=" + new Date().getTime());
      const data = await response.json();
      
      fullCatalog = Array.isArray(data) ? data : (data.data || []);
      renderTable();
    } catch (err) {
      console.error(err);
      document.getElementById("catalogTableBody").innerHTML = `<tr><td colspan="7" style="text-align:center; color:#e74c3c;">Erro ao carregar lista.</td></tr>`;
    }
  }

  function renderTable() {
    const tbody = document.getElementById("catalogTableBody");
    tbody.innerHTML = "";

    if (fullCatalog.length === 0) {
      tbody.innerHTML = `<tr><td colspan="7" style="text-align:center;">Nenhum item cadastrado.</td></tr>`;
      return;
    }

    fullCatalog.forEach((item) => {
      const isSet = item.isSet || item.IsSet;
      const isOcoc = item.isOcoc || item.IsOcoc;

      let badge = '<span class="badge badge-lata">LATA</span>';
      if (isSet && String(isSet).toLowerCase() === 'true') badge = '<span class="badge badge-set">SET</span>';
      else if (isOcoc && String(isOcoc).toLowerCase() === 'true') badge = '<span class="badge badge-ococ">OCOC</span>';

      const row = document.createElement("tr");
      row.innerHTML = `
        <td>${item.ID || item.id || item._rowId || '-'}</td>
        <td>${badge}</td>
        <td>${item.Nome || item.nome || item.name || '-'}</td>
        <td>${item.Cervejaria || item.cervejaria || item.brewery || '-'}</td>
        <td>${item.Pais || item.pais || item.country || '-'}</td>
        <td>${item.Volume || item.volume || '-'}</td>
        <td>
          <button class="btn-action btn-edit" onclick="editItem(${item._rowId})">EDITAR</button>
          <button class="btn-action btn-delete" onclick="deleteItem(${item._rowId})">EXCLUIR</button>
        </td>
      `;
      tbody.appendChild(row);
    });
  }

  function editItem(rowId) {
    const item = fullCatalog.find(c => c._rowId == rowId);
    if (!item) return;

    document.getElementById("editRowId").value = item._rowId;
    document.getElementById("inputNome").value = item.Nome || item.nome || item.name || "";
    document.getElementById("inputCervejaria").value = item.Cervejaria || item.cervejaria || item.brewery || "";
    document.getElementById("inputPais").value = item.Pais || item.pais || item.country || "";
    document.getElementById("inputVolume").value = item.Volume || item.volume || "";
    document.getElementById("inputAno").value = item.Ano || item.ano || "";
    document.getElementById("inputBarcode").value = item.Barcode || item.barcode || "";

    const isSet = item.isSet || item.IsSet;
    const isOcoc = item.isOcoc || item.IsOcoc;
    document.getElementById("checkOcoc").checked = isOcoc && String(isOcoc).toLowerCase() === 'true';
    document.getElementById("checkSet").checked = isSet && String(isSet).toLowerCase() === 'true';

    window.scrollTo({ top: 0, behavior: 'smooth' });
  }

  async function deleteItem(rowId) {
    if (!confirm("Tem certeza que deseja excluir esta lata?")) return;

    try {
      const response = await fetch(API_URL, {
        method: "POST",
        body: JSON.stringify({ action: "delete", _rowId: rowId })
      });
      const res = await response.json();
      if (res.success) {
        showStatus("Item excluído com sucesso!", true);
        loadCatalogTable();
      } else {
        showStatus("Erro ao excluir item.", false);
      }
    } catch (err) {
      showStatus("Erro ao comunicar com o servidor.", false);
    }
  }

  function resetForm() {
    document.getElementById("editRowId").value = "";
    document.getElementById("lataForm").reset();
  }

  window.onload = loadCatalogTable;
</script>
</body>
</html>
