<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>BeerCan Catalog - Sets de Latas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; outline: none; }
    
    body { background-color: #9B9B9B; color: #666666; height: 100vh; overflow: hidden; display: flex; user-select: none; }

    ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
    * { -ms-overflow-style: none !important; scrollbar-width: none !important; }

    .app-container { display: flex; width: 100vw; height: 100vh; overflow: hidden; position: relative; background-color: #9B9B9B; }

    .sidebar {
      width: 60px; min-width: 60px; background: #9B9B9B; border-right: none;
      display: flex; flex-direction: column; padding: 12px 6px; gap: 8px; height: 100%;
      z-index: 500; transition: width 0.25s ease-in-out; overflow-y: auto; overflow-x: hidden; white-space: nowrap; position: relative;
    }
    .sidebar:hover, .sidebar:focus-within { width: 250px; min-width: 250px; box-shadow: 10px 0 25px rgba(0,0,0,0.15); }

    .sidebar-logo-container { width: 100%; text-align: center; padding-bottom: 8px; border-bottom: none; flex-shrink: 0; }
    .sidebar-logo-img { width: 40px; height: 40px; object-fit: contain; transition: width 0.25s ease; }
    .sidebar:hover .sidebar-logo-img, .sidebar:focus-within .sidebar-logo-img { width: 160px; height: auto; }

    .menu-item {
      display: flex; align-items: center; gap: 14px; color: #666666; text-decoration: none;
      padding: 10px 12px; border-radius: 8px; font-size: 0.9rem; font-weight: 800; text-transform: uppercase;
      background: transparent; border: none !important; outline: none !important; box-shadow: none !important; cursor: pointer; width: 100%;
      text-align: left; transition: color 0.15s ease; flex-shrink: 0;
    }
    .menu-item i { 
      font-size: 1.2rem; min-width: 24px; text-align: center; font-style: normal; 
      color: #666666; filter: grayscale(100%) opacity(0.75); transition: filter 0.15s ease, color 0.15s ease; 
    }
    .menu-item span { opacity: 0; transition: opacity 0.2s ease; }
    .sidebar:hover .menu-item span, .sidebar:focus-within .menu-item span { opacity: 1; }
    .menu-item:focus, .menu-item:hover { color: #f39c12 !important; background: transparent !important; border: none !important; outline: none !important; box-shadow: none !important; }
    .menu-item:focus i, .menu-item:hover i { filter: none !important; color: #f39c12 !important; }

    .brand-inline-container {
      display: none; flex-direction: column; gap: 4px; padding-left: 12px; margin-top: -4px; margin-bottom: 4px; flex-shrink: 0;
    }
    .brand-inline-container.active { display: flex; }

    .brand-btn { 
      font-size: 0.8rem; padding: 8px 10px; border-radius: 6px; background: transparent; color: #666666; cursor: pointer; 
      border: none !important; outline: none !important; box-shadow: none !important; text-align: left; font-weight: 800; 
      text-transform: uppercase; transition: color 0.15s ease; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .brand-btn:focus, .brand-btn:hover { color: #f39c12 !important; background: transparent !important; border: none !important; outline: none !important; box-shadow: none !important; }

    .subpanel-overlay {
      position: absolute; top: 0; left: 60px; width: 280px; height: 100%;
      background: #9B9B9B; border-right: none; z-index: 600;
      display: flex; flex-direction: column; padding: 16px; gap: 12px;
      transform: translateX(-100%); opacity: 0; pointer-events: none;
      transition: transform 0.25s ease-in-out, opacity 0.25s ease-in-out; box-shadow: 15px 0 25px rgba(0,0,0,0.15);
    }
    .subpanel-overlay.active { transform: translateX(0); opacity: 1; pointer-events: auto; }

    .subpanel-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 2px solid #666666; padding-bottom: 8px; }
    .subpanel-title { font-size: 1rem; color: #666666; font-weight: 900; text-transform: uppercase; }
    .subpanel-close-btn { background: transparent; border: none; color: #666666; font-size: 1.4rem; cursor: pointer; font-weight: bold; }
    .subpanel-close-btn:focus, .subpanel-close-btn:hover { color: #f39c12; }

    .menu-search-box { width: 100%; padding: 8px; background: #888888; border: 2px solid #666666; border-radius: 6px; color: #fff; font-size: 0.85rem; font-weight: bold; text-align: center; text-transform: uppercase; }
    .menu-search-box::placeholder { color: #ccc; text-transform: uppercase; }
    .vk-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 3px; background: transparent; padding: 4px; border-radius: 6px; }
    .vk-key { background: transparent; border: 1px solid #666666; color: #666666; padding: 6px 0; border-radius: 4px; font-size: 0.7rem; font-weight: bold; cursor: pointer; text-align: center; text-transform: uppercase; }
    .vk-key:focus, .vk-key:hover { color: #f39c12; border-color: #f39c12 !important; }
    .vk-key-wide { grid-column: span 2; }

    .main-area { flex: 1; display: flex; flex-direction: column; height: 100vh; padding: 12px 16px; gap: 10px; overflow: hidden; background: #9B9B9B; min-width: 0; }

    .hero-panel {
      flex: 1; min-height: 0; background: #9B9B9B; border: none; border-radius: 12px;
      display: flex; padding: 12px 16px; gap: 24px; align-items: center; position: relative;
    }
    
    .hero-brand-logo-container {
      position: absolute; top: 12px; right: 24px; width: 220px; height: 100px;
      display: flex; justify-content: flex-end; align-items: flex-start; z-index: 20; pointer-events: none;
    }
    .hero-brand-logo-container img { max-width: 100%; max-height: 100%; object-fit: contain; }

    .hero-left-photos { height: 100%; aspect-ratio: 4 / 3; display: grid; grid-template-columns: repeat(2, 1fr); grid-template-rows: repeat(2, 1fr); gap: 8px; }
    .hero-photo-card {
      background: #fff; border-radius: 6px; padding: 4px; display: flex; justify-content: center; align-items: center;
      width: 100%; height: 100%; overflow: hidden; pointer-events: none;
    }
    .hero-photo-card img { width: 100%; height: 100%; object-fit: contain; }

    .hero-right-info { 
      flex: 1; height: 100%; display: flex; flex-direction: column; 
      justify-content: flex-start; gap: 12px; color: #f39c12; text-transform: uppercase; font-style: italic; overflow-y: auto; padding-right: 240px;
    }
    .hero-title { 
      font-size: clamp(1.3rem, 2.3vw, 1.9rem); font-weight: 900; line-height: 1.15; 
      color: #f39c12; margin-bottom: 4px; letter-spacing: 0.5px;
    }
    .info-block { display: flex; flex-direction: column; margin-bottom: 2px; }
    .info-label { font-size: clamp(0.75rem, 1.1vw, 0.95rem); font-weight: 900; color: #f39c12; line-height: 1.1; letter-spacing: 0.5px; }
    .info-val { font-size: clamp(1.05rem, 1.7vw, 1.45rem); font-weight: 900; color: #f39c12; line-height: 1.1; margin-top: 1px; }

    .counter-bar { display: flex; justify-content: flex-end; align-items: center; padding: 0 4px; margin-bottom: -4px; }
    .card-counter { font-size: 0.85rem; font-weight: 900; color: #f39c12; background: transparent; padding: 3px 10px; letter-spacing: 1px; }

    .catalog-section { height: 175px; min-height: 175px; width: 100%; overflow: hidden; flex-shrink: 0; }
    .card-row { display: flex; gap: 12px; height: 100%; width: 100%; justify-content: flex-start; align-items: center; }

    .card {
      background-color: #fff; border-radius: 8px; height: 100%; aspect-ratio: 4 / 3; flex-shrink: 0;
      overflow: hidden; display: flex; flex-direction: column; justify-content: space-between; align-items: center; padding: 4px;
      cursor: pointer; border: 2px solid transparent; box-sizing: border-box; transition: border-color 0.15s ease, box-shadow 0.15s ease;
    }
    .card img { width: 100%; height: calc(100% - 20px); object-fit: contain; }
    .card-label { background: rgba(0,0,0,0.8); color: #f39c12; width: 100%; text-align: center; font-size: 0.65rem; font-weight: bold; padding: 2px 0; text-transform: uppercase; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; border-radius: 0 0 4px 4px; }
    
    .card.focused { border-color: #f39c12 !important; box-shadow: 0 0 10px rgba(243, 156, 18, 0.7) !important; outline: none !important; z-index: 10; }

    .zoom-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 700; display: none; justify-content: center; align-items: center; padding: 16px; }
    .zoom-modal.active { display: flex; }
    .zoom-modal img { max-width: 85vw; max-height: 85vh; object-fit: contain; border-radius: 6px; cursor: pointer; }
    .zoom-close-btn { position: absolute; top: 15px; right: 20px; background: transparent; border: none; color: #666666; font-size: 2.5rem; cursor: pointer; z-index: 710; }
    .zoom-close-btn:focus, .zoom-close-btn:hover { color: #f39c12 !important; outline: none !important; }
  </style>
</head>
<body>

  <div class="app-container">
    <aside class="sidebar" id="sidebar">
      <div class="sidebar-logo-container"><img src="logo.png" alt="WCCollection Logo" class="sidebar-logo-img"></div>
      <button class="menu-item" onclick="location.href='index.html'" tabindex="0"><i>🏠</i><span>HOME</span></button>
      <button class="menu-item" onclick="toggleSubpanel('searchPanel')" tabindex="0"><i>🔍</i><span>PESQUISAR</span></button>
      
      <button class="menu-item" onclick="toggleBrandInline()" tabindex="0"><i>🏷️</i><span>MARCAS</span></button>
      <div class="brand-inline-container" id="brandInlineList"></div>

      <button class="menu-item" onclick="location.href='ococ.html'" tabindex="0"><i>🌍</i><span>OCOC</span></button>
      <button class="menu-item" onclick="location.href='sets.html'" tabindex="0"><i>📦</i><span>SETS</span></button>
      <button class="menu-item" onclick="location.href='admin.html'" tabindex="0"><i>⚙️</i><span>ADMIN</span></button>
    </aside>

    <div class="subpanel-overlay" id="searchPanel">
      <div class="subpanel-header"><div class="subpanel-title">🔍 PESQUISAR</div><button class="subpanel-close-btn" onclick="closeSubpanels()">&times;</button></div>
      <input type="text" id="menuSearchInput" class="menu-search-box" placeholder="DIGITE PARA BUSCAR..." tabindex="0">
      <div class="vk-container" id="vkContainer"></div>
    </div>

    <main class="main-area">
      <section class="hero-panel" id="heroPanel">
        <div class="hero-brand-logo-container" id="heroBrandLogo"></div>

        <div class="hero-left-photos" id="heroPhotos">
          <div class="hero-photo-card"><img src="" alt=""></div>
          <div class="hero-photo-card"><img src="" alt=""></div>
          <div class="hero-photo-card"><img src="" alt=""></div>
          <div class="hero-photo-card"><img src="" alt=""></div>
        </div>
        <div class="hero-right-info">
          <div class="hero-title" id="heroTitle">SELECIONE UM SET</div>
          <div class="info-block"><span class="info-label">ORIGEM:</span><div class="info-val" id="heroCountry">-</div></div>
          <div class="info-block"><span class="info-label">VOLUME:</span><div class="info-val" id="heroVolume">-</div></div>
          <div class="info-block"><span class="info-label">ANO:</span><div class="info-val" id="heroYear">-</div></div>
          <div class="info-block"><span class="info-label">CÓD. BARRAS:</span><div class="info-val" id="heroBarcode">-</div></div>
        </div>
      </section>

      <div class="counter-bar"><div class="card-counter" id="cardCounter">0/0</div></div>

      <section class="catalog-section" id="catalogSection">
        <div class="card-row" id="cardRow"></div>
      </section>
    </main>
  </div>

  <div class="zoom-modal" id="zoomModal">
    <button class="zoom-close-btn" onclick="closeZoomModal()" tabindex="0">&times;</button>
    <img id="zoomImage" src="" alt="Imagem ampliada" onclick="navigateZoom(1)">
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwFIsSgEF2grkBpliyO_hSD0Lh2ULq6xHoJC6mDLYvjemTLYe67jF38MDNWP2ixITzE/exec";
  let canCatalog = [];
  let currentFiltered = [];
  let zoomGallery = [];
  let currentZoomIndex = 0;

  const CARDS_PER_ROW = 5;
  let currentPage = 0;
  let activeLocalIndex = 0;

  async function fetchCatalogFromSheet() {
    if(!API_URL || API_URL.includes("COLE_AQUI")) return;
    try {
      const response = await fetch(API_URL);
      canCatalog = await response.json();
      currentFiltered = canCatalog.filter(can => can.isSet === true || can.isSet === "true");
      currentPage = 0;
      activeLocalIndex = 0;
      
      renderApp();
      buildVirtualKeyboard();
      buildBrandList();
      if(currentFiltered.length > 0) updateHeroPanel(currentFiltered[0], 0);

      focusCardSafely(0);
    } catch (err) {
      console.error("Erro ao carregar catálogo:", err);
    }
  }

  function clearAllCardFocus() {
    document.querySelectorAll(".card").forEach(c => {
      c.classList.remove("focused");
      c.blur();
    });
  }

  function focusCardSafely(targetIndex) {
    clearAllCardFocus();
    const cards = document.querySelectorAll(".card");
    if (cards.length > 0) {
      const finalIdx = Math.min(targetIndex, cards.length - 1);
      activeLocalIndex = finalIdx;
      cards[finalIdx].classList.add("focused");
      cards[finalIdx].focus();
    }
  }

  function toggleSubpanel(panelId) {
    const target = document.getElementById(panelId);
    const isActive = target.classList.contains("active");
    closeSubpanels();
    if (!isActive) target.classList.add("active");
  }

  function closeSubpanels() {
    document.querySelectorAll(".subpanel-overlay").forEach(p => p.classList.remove("active"));
  }

  function toggleBrandInline() {
    closeSubpanels();
    const container = document.getElementById("brandInlineList");
    container.classList.toggle("active");
  }

  function buildVirtualKeyboard() {
    const container = document.getElementById("vkContainer");
    container.innerHTML = "";
    vkKeys.forEach(k => {
      const btn = document.createElement("button");
      btn.className = `vk-key ${ (k === 'ESPAÇO' || k === 'DEL' || k === 'LIMPAR') ? 'vk-key-wide' : '' }`;
      btn.tabIndex = 0; btn.innerText = k;
      btn.onclick = () => handleVkPress(k);
      container.appendChild(btn);
    });
    const input = document.getElementById("menuSearchInput");
    input.oninput = (e) => filterCatalog(e.target.value);
  }

  function handleVkPress(key) {
    const input = document.getElementById("menuSearchInput");
    if (key === 'ESPAÇO') input.value += ' ';
    else if (key === 'DEL') input.value = input.value.slice(0, -1);
    else if (key === 'LIMPAR') input.value = '';
    else input.value += key;
    filterCatalog(input.value);
  }

  function buildBrandList() {
    const brandContainer = document.getElementById("brandInlineList");
    brandContainer.innerHTML = "";
    const brands = [...new Set(currentFiltered.map(c => c.brewery).filter(Boolean))].sort();
    
    const allBtn = document.createElement("button");
    allBtn.className = "brand-btn"; allBtn.tabIndex = 0; allBtn.innerText = "⭐ TODOS OS SETS";
    allBtn.onclick = () => { filterCatalog(""); document.getElementById("brandInlineList").classList.remove("active"); };
    brandContainer.appendChild(allBtn);

    brands.forEach(b => {
      const btn = document.createElement("button");
      btn.className = "brand-btn"; btn.tabIndex = 0; btn.innerText = b.toUpperCase();
      btn.onclick = () => { filterCatalog(b); document.getElementById("brandInlineList").classList.remove("active"); };
      brandContainer.appendChild(btn);
    });
  }

  function filterCatalog(query) {
    const val = query.toLowerCase().trim();
    currentFiltered = canCatalog.filter(can => {
      if (!can.isSet && can.isSet !== "true") return false;
      if (!val) return true;
      return [can.name, can.brewery, can.country, can.volume, can.year, can.barcode].map(v => String(v || "").toLowerCase()).join(" ").includes(val);
    });
    currentPage = 0;
    activeLocalIndex = 0;
    renderApp();
    if(currentFiltered.length > 0) {
      updateHeroPanel(currentFiltered[0], 0);
      focusCardSafely(0);
    } else {
      document.getElementById("cardCounter").innerText = "0/0";
    }
  }

  function renderApp() {
    const row = document.getElementById("cardRow");
    row.innerHTML = "";

    const startIndex = currentPage * CARDS_PER_ROW;
    const pageItems = currentFiltered.slice(startIndex, startIndex + CARDS_PER_ROW);

    pageItems.forEach((can, localIndex) => {
      const globalIndex = startIndex + localIndex;
      const coverImg = can.images ? (can.images.front || can.images.left || can.images.back || can.images.right || can.images.cover) : "";
      const card = document.createElement("div");
      card.className = "card"; card.tabIndex = 0;
      card.dataset.globalIndex = globalIndex;
      
      card.onfocus = () => {
        document.querySelectorAll(".card").forEach(c => c.classList.remove("focused"));
        card.classList.add("focused");
        activeLocalIndex = localIndex;
        updateHeroPanel(can, globalIndex);
      };
      
      card.onclick = () => openZoomModal(0);
      card.onkeydown = (e) => {
        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openZoomModal(0);
        } else if (e.key === "ArrowRight") {
          if (localIndex === pageItems.length - 1 && (startIndex + CARDS_PER_ROW) < currentFiltered.length) {
            e.preventDefault();
            currentPage++;
            renderApp();
            focusCardSafely(0);
          }
        } else if (e.key === "ArrowLeft") {
          if (localIndex === 0) {
            e.preventDefault();
            if (currentPage > 0) {
              currentPage--;
              renderApp();
              focusCardSafely(CARDS_PER_ROW - 1);
            } else {
              clearAllCardFocus();
              const firstMenuItem = document.querySelector(".menu-item");
              if (firstMenuItem) firstMenuItem.focus();
            }
          }
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          if ((startIndex + CARDS_PER_ROW) < currentFiltered.length) {
            currentPage++;
            renderApp();
            focusCardSafely(activeLocalIndex);
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (currentPage > 0) {
            currentPage--;
            renderApp();
            focusCardSafely(activeLocalIndex);
          }
        }
      };

      card.innerHTML = `<img src="${coverImg}" alt="${can.name}" loading="lazy"><div class="card-label">${(can.name || '').toUpperCase()}</div>`;
      row.appendChild(card);
    });
  }

  function updateHeroPanel(can, index = 0) {
    document.getElementById("heroTitle").innerText = (can.name || "").toUpperCase();
    document.getElementById("heroCountry").innerText = (can.country || "-").toUpperCase();
    document.getElementById("heroVolume").innerText = (can.volume || "-").toUpperCase();
    document.getElementById("heroYear").innerText = can.year || "-";
    document.getElementById("heroBarcode").innerText = can.barcode || "-";

    const logoContainer = document.getElementById("heroBrandLogo");
    const logoUrl = can.brandLogo || can.images?.brandLogo;
    if (logoUrl) {
      logoContainer.innerHTML = `<img src="${logoUrl}" alt="LOGO DA CERVEJARIA">`;
    } else {
      logoContainer.innerHTML = "";
    }

    const total = currentFiltered.length;
    const currentNum = total > 0 ? (index + 1) : 0;
    document.getElementById("cardCounter").innerText = `${currentNum}/${total}`;

    const photosContainer = document.getElementById("heroPhotos");
    photosContainer.innerHTML = "";

    zoomGallery = [can.images?.front, can.images?.left, can.images?.back, can.images?.right].filter(Boolean);

    zoomGallery.forEach((url, idx) => {
      const photoCard = document.createElement("div");
      photoCard.className = "hero-photo-card";
      photoCard.innerHTML = `<img src="${url}" alt="FOTO ${idx+1}">`;
      photosContainer.appendChild(photoCard);
    });
  }

  function openZoomModal(index) {
    if (!zoomGallery || zoomGallery.length === 0) return;
    currentZoomIndex = index;
    document.getElementById("zoomImage").src = zoomGallery[currentZoomIndex];
    document.getElementById("zoomModal").classList.add("active");
  }

  function navigateZoom(direction) {
    if (!zoomGallery || zoomGallery.length === 0) return;
    currentZoomIndex = (currentZoomIndex + direction + zoomGallery.length) % zoomGallery.length;
    document.getElementById("zoomImage").src = zoomGallery[currentZoomIndex];
  }

  function closeZoomModal() {
    document.getElementById("zoomModal").classList.remove("active");
  }

  document.addEventListener("keydown", (e) => {
    const isZoomActive = document.getElementById("zoomModal").classList.contains("active");
    const activeElem = document.activeElement;

    if (isZoomActive) {
      if (e.key === "ArrowLeft") { e.preventDefault(); navigateZoom(-1); }
      else if (e.key === "ArrowRight") { e.preventDefault(); navigateZoom(1); }
      else if (e.key === "Escape" || e.key === "Back" || e.keyCode === 10009 || e.keyCode === 27) { closeZoomModal(); }
    } else {
      if (e.key === "Escape" || e.key === "Back" || e.keyCode === 10009 || e.keyCode === 27) {
        closeSubpanels();
        document.getElementById("brandInlineList").classList.remove("active");
      }

      if (activeElem && (activeElem.classList.contains("menu-item") || activeElem.classList.contains("brand-btn")) && e.key === "ArrowRight") {
        e.preventDefault();
        focusCardSafely(0);
      }
    }
  });

  window.onload = fetchCatalogFromSheet;
</script>
</body>
</html>
