<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WCCollection - TV Display</title>
  <style>
    :root {
      --bg-color: #0f131d;
      --card-bg: #ffffff;
      --accent-color: #f39c12;
      --text-main: #ffffff;
      --border-color: #2a3447;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; outline: none; }

    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      padding: 25px 35px;
      justify-content: space-between;
    }

    /* ========================================================
       SEÇÃO SUPERIOR (FOTOS 2x2 + TEXTOS + LOGO DA MARCA)
       ======================================================== */
    .top-section {
      display: flex;
      width: 100%;
      height: 68vh; /* Ocupa a maior parte da tela superior */
      gap: 40px;
      position: relative;
      align-items: stretch;
    }

    /* Grid 2x2 com os 4 Cards de Fotos Brancos na Esquerda */
    .photos-grid-2x2 {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: 1fr 1fr;
      gap: 16px;
      width: 38vw; /* Largura proporcional da área de fotos */
      height: 100%;
    }

    .photo-card {
      background: #ffffff;
      border-radius: 18px;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 12px;
      box-shadow: 0 8px 20px rgba(0,0,0,0.6);
      overflow: hidden;
    }

    .photo-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* Bloco Central de Textos - Esticado do topo à base do Grid (MARCAÇÃO VERMELHA) */
    .details-info-box {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: space-between; /* Distribui o texto do topo do 1º card ao fim do 4º card */
      height: 100%;
      padding-right: 320px; /* Evita que o texto encoste no logo grande */
      padding-top: 5px;
      padding-bottom: 5px;
    }

    /* Título do Item */
    .item-title-display {
      color: var(--accent-color);
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 3.2vw;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      line-height: 1.05;
      letter-spacing: 1px;
    }

    /* Blocos de Cada Informação */
    .info-group {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    /* Rótulos: ORIGEM:, VOLUME:, ANO:, CÓD. BARRAS: */
    .info-label-text {
      color: var(--accent-color);
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 1.6vw;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Valores: CHINA, 500ML, 2024, etc. */
    .info-val-text {
      color: var(--accent-color);
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 2.6vw;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      line-height: 1.1;
      letter-spacing: 1px;
    }

    /* Logo da Marca no Canto Superior Direito (EXPANDIDO ATÉ A LINHA AMARELA) */
    .brand-logo-top-right {
      position: absolute;
      top: 0;
      right: 0;
      max-height: 280px; /* Altura expandida para atingir a linha amarela */
      max-width: 420px;  /* Largura proporcional */
      object-fit: contain;
      z-index: 10;
      filter: drop-shadow(0 4px 12px rgba(0,0,0,0.5));
    }

    /* Contador 1/4 no canto inferior direito da área superior */
    .counter-display {
      position: absolute;
      bottom: 10px;
      right: 0;
      color: var(--accent-color);
      font-family: Impact, "Arial Black", sans-serif;
      font-size: 1.8vw;
      font-style: italic;
      font-weight: 900;
    }

    /* ========================================================
       SEÇÃO INFERIOR (CARROSSEL / LISTA DE LATAS)
       ======================================================== */
    .bottom-section {
      width: 100%;
      height: 24vh;
      display: flex;
      gap: 20px;
      overflow-x: auto;
      align-items: center;
      padding-bottom: 5px;
    }

    .carousel-card {
      flex: 0 0 220px;
      height: 100%;
      background: #181f2e;
      border: 2px solid transparent;
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      cursor: pointer;
      transition: all 0.2s ease;
    }

    .carousel-card.active {
      border-color: var(--accent-color);
      box-shadow: 0 0 20px rgba(243, 156, 18, 0.4);
      transform: scale(1.03);
    }

    .carousel-card-photo {
      background: #ffffff;
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 10px;
    }

    .carousel-card-photo img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    .carousel-card-info {
      padding: 8px 12px;
      background: #111520;
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .carousel-card-title {
      color: #fff;
      font-weight: 800;
      font-size: 0.85rem;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .carousel-card-meta {
      display: flex;
      justify-content: space-between;
      color: #a0aec0;
      font-size: 0.72rem;
      font-weight: 700;
    }

    .empty-state {
      width: 100%;
      text-align: center;
      color: #a0aec0;
      font-size: 1.2rem;
    }
  </style>
</head>
<body>

  <!-- ÁREA SUPERIOR (TV VIEW) -->
  <section class="top-section">
    <!-- Grid 2x2 com as 4 fotos -->
    <div class="photos-grid-2x2">
      <div class="photo-card"><img id="imgCard1" src="" alt=""></div>
      <div class="photo-card"><img id="imgCard2" src="" alt=""></div>
      <div class="photo-card"><img id="imgCard3" src="" alt=""></div>
      <div class="photo-card"><img id="imgCard4" src="" alt=""></div>
    </div>

    <!-- Bloco dos Textos (Preenche do topo ao fim das fotos) -->
    <div class="details-info-box">
      <div class="item-title-display" id="displayTitle">---</div>

      <div class="info-group">
        <span class="info-label-text">ORIGEM:</span>
        <span class="info-val-text" id="displayCountry">---</span>
      </div>

      <div class="info-group">
        <span class="info-label-text">VOLUME:</span>
        <span class="info-val-text" id="displayVolume">---</span>
      </div>

      <div class="info-group">
        <span class="info-label-text">ANO:</span>
        <span class="info-val-text" id="displayYear">---</span>
      </div>

      <div class="info-group">
        <span class="info-label-text">CÓD. BARRAS:</span>
        <span class="info-val-text" id="displayBarcode">---</span>
      </div>
    </div>

    <!-- Logo no canto superior direito -->
    <img id="displayBrandLogo" class="brand-logo-top-right" src="" alt="" style="display:none;">

    <!-- Contador de imagens -->
    <div class="counter-display" id="displayCounter">1/4</div>
  </section>

  <!-- ÁREA INFERIOR (CARROSSEL) -->
  <section class="bottom-section" id="bottomCarousel">
    <div class="empty-state">Carregando coleção...</div>
  </section>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwP4kTpSrGJllmlWjQp1YmD1Th5jiw1oUtX5cAJAZj9txy-eNi6_EYyLPG_Q0_coyT9/exec";
  let catalogData = [];
  let selectedIndex = 0;

  function getItemVal(item, keys) {
    if (!item) return "";
    for (let k of keys) {
      if (item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== "") {
        return item[k];
      }
    }
    return "";
  }

  async function fetchCatalog() {
    try {
      const response = await fetch(API_URL + "?nocache=" + new Date().getTime());
      const data = await response.json();
      catalogData = Array.isArray(data) ? data : (data.data || []);

      if (catalogData.length > 0) {
        renderCarousel();
        selectItem(0);
      } else {
        document.getElementById("bottomCarousel").innerHTML = `<div class="empty-state">Nenhum item encontrado.</div>`;
      }
    } catch (err) {
      console.error(err);
      document.getElementById("bottomCarousel").innerHTML = `<div class="empty-state" style="color:#e74c3c;">Erro ao carregar os dados.</div>`;
    }
  }

  function renderCarousel() {
    const carouselEl = document.getElementById("bottomCarousel");
    carouselEl.innerHTML = "";

    catalogData.forEach((item, idx) => {
      const nome = getItemVal(item, ["Nome", "nome", "name"]) || "Sem Título";
      const pais = getItemVal(item, ["Pais", "pais", "country"]) || "";
      const volume = getItemVal(item, ["Volume", "volume"]) || "";

      const cover = getItemVal(item, ["ImgCover", "imgcover", "cover"]);
      const front = getItemVal(item, ["ImgFront", "imgfront", "front"]);
      const mainImg = cover || front || "https://via.placeholder.com/200x260/ffffff/a0aec0?text=Sem+Foto";

      const card = document.createElement("div");
      card.className = `carousel-card ${idx === 0 ? 'active' : ''}`;
      card.id = `card-item-${idx}`;
      card.onclick = () => selectItem(idx);

      card.innerHTML = `
        <div class="carousel-card-photo">
          <img src="${mainImg}" alt="${nome}">
        </div>
        <div class="carousel-card-info">
          <div class="carousel-card-title">${nome}</div>
          <div class="carousel-card-meta">
            <span>📍 ${pais}</span>
            <span>${volume}</span>
          </div>
        </div>
      `;

      carouselEl.appendChild(card);
    });
  }

  function selectItem(idx) {
    if (!catalogData[idx]) return;
    selectedIndex = idx;

    // Atualiza seleção visual no carrossel
    document.querySelectorAll(".carousel-card").forEach((c, i) => {
      c.classList.toggle("active", i === idx);
    });

    const item = catalogData[idx];

    // Atualiza Textos
    document.getElementById("displayTitle").innerText = getItemVal(item, ["Nome", "nome", "name"]) || "SEM NOME";
    document.getElementById("displayCountry").innerText = getItemVal(item, ["Pais", "pais", "country"]) || "---";
    document.getElementById("displayVolume").innerText = getItemVal(item, ["Volume", "volume"]) || "---";
    document.getElementById("displayYear").innerText = getItemVal(item, ["Ano", "ano"]) || "---";
    document.getElementById("displayBarcode").innerText = getItemVal(item, ["Barcode", "barcode"]) || "---";

    // Atualiza Logo da Marca
    const logoUrl = getItemVal(item, ["BRAND_LOGO", "brand_logo", "logo"]);
    const logoEl = document.getElementById("displayBrandLogo");
    if (logoUrl) {
      logoEl.src = logoUrl;
      logoEl.style.display = "block";
    } else {
      logoEl.style.display = "none";
    }

    // Atualiza os 4 Cards de Fotos (Grid 2x2)
    const photos = [
      getItemVal(item, ["ImgFront", "imgfront", "front"]),
      getItemVal(item, ["ImgCover", "imgcover", "cover"]),
      getItemVal(item, ["ImgLeft", "imgleft", "left"]),
      getItemVal(item, ["ImgBack", "imgback", "back"]),
      getItemVal(item, ["ImgRight", "imgright", "right"])
    ].filter(p => p !== "");

    const imgEls = [
      document.getElementById("imgCard1"),
      document.getElementById("imgCard2"),
      document.getElementById("imgCard3"),
      document.getElementById("imgCard4")
    ];

    imgEls.forEach((img, i) => {
      if (photos[i]) {
        img.src = photos[i];
        img.parentElement.style.display = "flex";
      } else if (photos[0]) {
        img.src = photos[0]; // Preenche com a foto principal caso tenha menos de 4
        img.parentElement.style.display = "flex";
      } else {
        img.src = "https://via.placeholder.com/300?text=Sem+Foto";
      }
    });

    document.getElementById("displayCounter").innerText = `1/${photos.length || 1}`;
  }

  window.onload = fetchCatalog;
</script>
</body>
</html>
