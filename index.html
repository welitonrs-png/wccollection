<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WCCollection - Catálogo de Latas</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      outline: none;
    }

    body {
      background-color: #121620;
      color: #ffffff;
      height: 100vh;
      width: 100vw;
      overflow: hidden;
      display: flex;
      flex-direction: column;
    }

    /* BARRA SUPERIOR / MENU DE NAVEGAÇÃO */
    .top-bar {
      height: 70px;
      background: #161b26;
      border-bottom: 1px solid #2a3447;
      display: flex;
      align-items: center;
      justify-content: space-between;
      padding: 0 40px;
      z-index: 10;
    }

    .brand-title {
      font-size: 1.5rem;
      font-weight: 900;
      color: #f39c12;
      letter-spacing: 1px;
    }

    .nav-filters {
      display: flex;
      gap: 15px;
    }

    .btn-nav {
      background: #2a3447;
      color: #a0aec0;
      border: 1px solid #333d52;
      padding: 10px 20px;
      border-radius: 8px;
      font-weight: 800;
      font-size: 0.85rem;
      text-transform: uppercase;
      cursor: pointer;
      transition: all 0.2s;
    }

    .btn-nav.active, .btn-nav:focus {
      background: #f39c12;
      color: #1a1f2c;
      border-color: #f39c12;
      box-shadow: 0 0 12px rgba(243, 156, 18, 0.4);
    }

    .search-box {
      position: relative;
      display: flex;
      align-items: center;
    }

    .search-input {
      background: #11141d;
      border: 1px solid #333d52;
      color: #fff;
      padding: 10px 16px;
      border-radius: 8px;
      font-size: 0.85rem;
      width: 250px;
    }

    /* ESTRUTURA PRINCIPAL DO APLICATIVO DA TV */
    .app-container {
      flex: 1;
      display: flex;
      width: 100%;
      height: calc(100vh - 70px);
      padding: 30px 40px;
      gap: 50px;
      position: relative;
    }

    /* COLUNA DA ESQUERDA: CARROSSEL DE IMAGENS E VISUALIZAÇÃO 360 */
    .photos-column {
      width: 380px;
      height: 100%;
      display: flex;
      flex-direction: column;
      gap: 20px;
      justify-content: center;
      align-items: center;
    }

    .photo-card-main {
      width: 100%;
      height: 60%;
      background: #161b26;
      border: 2px solid #2a3447;
      border-radius: 16px;
      display: flex;
      justify-content: center;
      align-items: center;
      overflow: hidden;
      box-shadow: 0 12px 30px rgba(0,0,0,0.6);
      padding: 20px;
      position: relative;
    }

    .photo-card-main img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.7));
      transition: transform 0.3s;
    }

    .thumbs-row {
      display: flex;
      gap: 12px;
      width: 100%;
      justify-content: center;
    }

    .thumb-card {
      width: 65px;
      height: 65px;
      background: #161b26;
      border: 2px solid #2a3447;
      border-radius: 10px;
      display: flex;
      justify-content: center;
      align-items: center;
      cursor: pointer;
      padding: 5px;
    }

    .thumb-card.active, .thumb-card:focus {
      border-color: #f39c12;
      box-shadow: 0 0 10px rgba(243, 156, 18, 0.5);
    }

    .thumb-card img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* COLUNA DA DIREITA: PAINEL DE INFORMAÇÕES DETALHADAS */
    .info-column {
      flex: 1;
      display: flex;
      flex-direction: column;
      justify-content: flex-start;
      padding-top: 10px;
      padding-right: 220px; /* Espaço para a logo da marca */
    }

    .item-title {
      font-size: 3rem;
      font-weight: 900;
      color: #f39c12;
      text-transform: uppercase;
      line-height: 1.1;
      margin-bottom: 30px;
      letter-spacing: 1px;
      text-shadow: 2px 2px 4px rgba(0,0,0,0.6);
    }

    .details-grid {
      display: flex;
      flex-direction: column;
      gap: 22px;
    }

    .detail-item {
      display: flex;
      flex-direction: column;
      gap: 4px;
    }

    .detail-label {
      font-size: 0.9rem;
      font-weight: 900;
      color: #e67e22;
      text-transform: uppercase;
      letter-spacing: 1.5px;
    }

    .detail-value {
      font-size: 1.8rem;
      font-weight: 800;
      color: #ffffff;
      text-transform: uppercase;
    }

    /* LOGO DA MARCA (CORRIGIDA NO TOPO DIREITO) */
    .brand-logo-container {
      position: absolute;
      top: 30px;
      right: 40px;
      width: 180px;
      height: 110px;
      background: rgba(22, 27, 38, 0.85);
      border: 1px solid #333d52;
      border-radius: 14px;
      padding: 12px;
      display: flex;
      justify-content: center;
      align-items: center;
      box-shadow: 0 8px 25px rgba(0,0,0,0.5);
      backdrop-filter: blur(8px);
      z-index: 5;
    }

    .brand-logo-container img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
    }

    /* CONTADOR NO CANTO INFERIOR DIREITO */
    .footer-counter {
      position: absolute;
      bottom: 30px;
      right: 40px;
      font-size: 2rem;
      font-weight: 900;
      color: #f39c12;
      letter-spacing: 2px;
      text-shadow: 2px 2px 6px rgba(0,0,0,0.8);
    }

    /* LOADING E MENSAGENS */
    .loading-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #121620;
      display: flex;
      justify-content: center;
      align-items: center;
      font-size: 1.5rem;
      font-weight: bold;
      color: #f39c12;
      z-index: 100;
    }
  </style>
</head>
<body>

  <!-- BARRA SUPERIOR / NAVEGAÇÃO -->
  <div class="top-bar">
    <div class="brand-title">WCCOLLECTION</div>

    <div class="nav-filters">
      <button class="btn-nav active" id="btnHome" onclick="filterCategory('home')">TODAS AS LATAS</button>
      <button class="btn-nav" id="btnSets" onclick="filterCategory('sets')">SETS / PACKS</button>
      <button class="btn-nav" id="btnOcoc" onclick="filterCategory('ococ')">OCOC (PAÍSES)</button>
    </div>

    <div class="search-box">
      <input type="text" class="search-input" id="searchInput" placeholder="Buscar lata, país, ano..." oninput="handleSearch()">
    </div>
  </div>

  <div id="loading" class="loading-overlay">Carregando catálogo de latas...</div>

  <div class="app-container">
    
    <!-- COLUNA DA ESQUERDA: FOTOS E MINIATURAS -->
    <div class="photos-column">
      <div class="photo-card-main">
        <img id="imgMain" src="" alt="Lata">
      </div>

      <div class="thumbs-row">
        <div class="thumb-card active" tabindex="0" onclick="switchAngle('cover')">
          <img id="thumbCover" src="" alt="Capa">
        </div>
        <div class="thumb-card" tabindex="0" onclick="switchAngle('front')">
          <img id="thumbFront" src="" alt="Frente">
        </div>
        <div class="thumb-card" tabindex="0" onclick="switchAngle('left')">
          <img id="thumbLeft" src="" alt="Esquerda">
        </div>
        <div class="thumb-card" tabindex="0" onclick="switchAngle('back')">
          <img id="thumbBack" src="" alt="Verso">
        </div>
        <div class="thumb-card" tabindex="0" onclick="switchAngle('right')">
          <img id="thumbRight" src="" alt="Direita">
        </div>
      </div>
    </div>

    <!-- COLUNA DA DIREITA: INFORMAÇÕES DETALHADAS -->
    <div class="info-column">
      <h1 class="item-title" id="txtNome">-</h1>

      <div class="details-grid">
        <div class="detail-item">
          <span class="detail-label">CERVEJARIA:</span>
          <span class="detail-value" id="txtCervejaria">-</span>
        </div>

        <div class="detail-item">
          <span class="detail-label">PAÍS DE ORIGEM:</span>
          <span class="detail-value" id="txtPais">-</span>
        </div>

        <div class="detail-item">
          <span class="detail-label">VOLUME:</span>
          <span class="detail-value" id="txtVolume">-</span>
        </div>

        <div class="detail-item">
          <span class="detail-label">ANO DE LANÇAMENTO:</span>
          <span class="detail-value" id="txtAno">-</span>
        </div>

        <div class="detail-item">
          <span class="detail-label">CÓDIGO DE BARRAS:</span>
          <span class="detail-value" id="txtBarcode">-</span>
        </div>
      </div>
    </div>

    <!-- LOGO DA MARCA (AUSTUSTADA NO TOPO DIREITO) -->
    <div class="brand-logo-container" id="logoBox">
      <img id="imgLogo" src="" alt="Logo da Marca" onerror="this.style.display='none'">
    </div>

    <!-- CONTADOR DE PÁGINAS -->
    <div class="footer-counter" id="txtCounter">0/0</div>

  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwFIsSgEF2grkBpliyO_hSD0Lh2ULq6xHoJC6mDLYvjemTLYe67jF38MDNWP2ixITzE/exec";
  
  let fullCatalog = [];
  let filteredCatalog = [];
  let currentIndex = 0;
  let currentCategory = 'home';
  let currentImages = {};

  async function loadCatalog() {
    try {
      document.getElementById("loading").style.display = "flex";
      const res = await fetch(API_URL + "?nocache=" + new Date().getTime());
      const data = await res.json();
      
      fullCatalog = Array.isArray(data) ? data : (data.data || []);
      applyFilters();

      document.getElementById("loading").style.display = "none";
    } catch (err) {
      console.error("Erro ao carregar catálogo:", err);
      document.getElementById("loading").innerText = "Erro ao carregar os dados. Verifique a conexão.";
    }
  }

  function applyFilters() {
    const search = document.getElementById("searchInput").value.toLowerCase().trim();

    filteredCatalog = fullCatalog.filter(can => {
      const isSet = can.isSet || can.IsSet;
      const isOcoc = can.isOcoc || can.IsOcoc;

      if (currentCategory === "home" && isSet && String(isSet).toLowerCase() === 'true') return false;
      if (currentCategory === "sets" && (!isSet || String(isSet).toLowerCase() !== 'true')) return false;
      if (currentCategory === "ococ" && (!isOcoc || String(isOcoc).toLowerCase() !== 'true')) return false;

      if (search) {
        const matchString = [
          can.Nome || can.nome || can.name,
          can.Cervejaria || can.cervejaria || can.brewery,
          can.Pais || can.pais || can.country,
          can.Volume || can.volume,
          can.Ano || can.ano,
          can.Barcode || can.barcode
        ].join(" ").toLowerCase();

        if (matchString.indexOf(search) === -1) return false;
      }

      return true;
    });

    currentIndex = 0;
    if (filteredCatalog.length > 0) {
      displayItem(0);
    } else {
      clearDisplay();
    }
  }

  function filterCategory(cat) {
    currentCategory = cat;
    document.querySelectorAll('.btn-nav').forEach(btn => btn.classList.remove('active'));

    if (cat === 'home') document.getElementById('btnHome').classList.add('active');
    if (cat === 'sets') document.getElementById('btnSets').classList.add('active');
    if (cat === 'ococ') document.getElementById('btnOcoc').classList.add('active');

    applyFilters();
  }

  function handleSearch() {
    applyFilters();
  }

  function displayItem(index) {
    if (index < 0 || index >= filteredCatalog.length) return;
    currentIndex = index;
    const item = filteredCatalog[index];

    // Atualiza Informações do Texto
    document.getElementById("txtNome").innerText = item.Nome || item.nome || item.name || "LATA SEM NOME";
    document.getElementById("txtCervejaria").innerText = item.Cervejaria || item.cervejaria || item.brewery || "-";
    document.getElementById("txtPais").innerText = item.Pais || item.pais || item.country || "-";
    document.getElementById("txtVolume").innerText = item.Volume || item.volume || "-";
    document.getElementById("txtAno").innerText = item.Ano || item.ano || "-";
    document.getElementById("txtBarcode").innerText = item.Barcode || item.barcode || "-";

    // Atualiza Contador
    document.getElementById("txtCounter").innerText = `${currentIndex + 1}/${filteredCatalog.length}`;

    // Guarda e Atualiza Ângulos de Imagem
    currentImages = {
      cover: item.ImgCover || item.imgcover || item.cover,
      front: item.ImgFront || item.imgfront || item.front,
      left:  item.ImgLeft  || item.imgleft  || item.left,
      back:  item.ImgBack  || item.imgback  || item.back,
      right: item.ImgRight || item.imgright || item.right
    };

    // Define miniaturas
    setImgSrc("thumbCover", currentImages.cover);
    setImgSrc("thumbFront", currentImages.front);
    setImgSrc("thumbLeft",  currentImages.left);
    setImgSrc("thumbBack",  currentImages.back);
    setImgSrc("thumbRight", currentImages.right);

    // Define imagem principal padrão (Cover ou Front)
    switchAngle('cover');

    // Define Logo da Marca
    const logoUrl = item.BRAND_LOGO || item.brandLogo || item.logo;
    const logoImg = document.getElementById("imgLogo");
    if (logoUrl && logoUrl.trim() !== "") {
      logoImg.src = logoUrl;
      logoImg.style.display = "block";
    } else {
      logoImg.style.display = "none";
    }
  }

  function switchAngle(angle) {
    const url = currentImages[angle] || currentImages.cover || currentImages.front;
    setImgSrc("imgMain", url);

    document.querySelectorAll('.thumb-card').forEach(card => card.classList.remove('active'));
    if (angle === 'cover') document.querySelectorAll('.thumb-card')[0]?.classList.add('active');
    if (angle === 'front') document.querySelectorAll('.thumb-card')[1]?.classList.add('active');
    if (angle === 'left')  document.querySelectorAll('.thumb-card')[2]?.classList.add('active');
    if (angle === 'back')  document.querySelectorAll('.thumb-card')[3]?.classList.add('active');
    if (angle === 'right') document.querySelectorAll('.thumb-card')[4]?.classList.add('active');
  }

  function setImgSrc(id, url) {
    const el = document.getElementById(id);
    if (url && url.trim() !== "") {
      el.src = url;
      el.style.display = "block";
    } else {
      el.style.display = "none";
    }
  }

  function clearDisplay() {
    document.getElementById("txtNome").innerText = "NENHUM ITEM ENCONTRADO";
    document.getElementById("txtCervejaria").innerText = "-";
    document.getElementById("txtPais").innerText = "-";
    document.getElementById("txtVolume").innerText = "-";
    document.getElementById("txtAno").innerText = "-";
    document.getElementById("txtBarcode").innerText = "-";
    document.getElementById("txtCounter").innerText = "0/0";
    document.getElementById("imgMain").style.display = "none";
    document.getElementById("imgLogo").style.display = "none";
  }

  // NAVEGAÇÃO POR D-PAD E TECLADO DA SMART TV
  document.addEventListener("keydown", (e) => {
    if (e.target.tagName === "INPUT") return;

    if (e.key === "ArrowRight") {
      if (currentIndex < filteredCatalog.length - 1) displayItem(currentIndex + 1);
    } else if (e.key === "ArrowLeft") {
      if (currentIndex > 0) displayItem(currentIndex - 1);
    } else if (e.key === "ArrowDown") {
      if (currentIndex + 5 < filteredCatalog.length) displayItem(currentIndex + 5);
    } else if (e.key === "ArrowUp") {
      if (currentIndex - 5 >= 0) displayItem(currentIndex - 5);
    }
  });

  window.onload = loadCatalog;
</script>
</body>
</html>
