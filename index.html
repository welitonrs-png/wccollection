<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WCCollection - Coleção de Latas</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121620; color: #ffffff; min-height: 100vh; padding: 20px; }

    header {
      max-width: 1200px; margin: 0 auto 30px auto; display: flex;
      flex-direction: column; gap: 16px; align-items: center; text-align: center;
    }

    h1 { color: #f39c12; font-size: 2.2rem; font-weight: 900; letter-spacing: 1px; text-transform: uppercase; }

    /* Controles de Filtro e Busca */
    .controls {
      display: flex; flex-wrap: wrap; gap: 12px; width: 100%; max-width: 800px; justify-content: center;
    }

    .search-input {
      flex: 1; min-width: 250px; padding: 12px 18px; background: #1a202c; border: 1px solid #2d3748;
      border-radius: 25px; color: #ffffff; font-size: 0.95rem; outline: none; transition: all 0.3s;
    }
    .search-input:focus { border-color: #f39c12; box-shadow: 0 0 10px rgba(243, 156, 18, 0.3); }

    .filter-btn {
      padding: 10px 20px; background: #1a202c; border: 1px solid #2d3748; border-radius: 20px;
      color: #a0aec0; font-weight: bold; font-size: 0.85rem; cursor: pointer; transition: all 0.3s; text-transform: uppercase;
    }
    .filter-btn.active, .filter-btn:hover { background: #f39c12; color: #121620; border-color: #f39c12; }

    /* Grid do Catálogo */
    .catalog-grid {
      display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
      gap: 20px; max-width: 1200px; margin: 0 auto;
    }

    .can-card {
      background: #1a202c; border: 1px solid #2d3748; border-radius: 12px; overflow: hidden;
      display: flex; flex-direction: column; transition: transform 0.3s, box-shadow 0.3s; cursor: pointer;
      position: relative;
    }
    .can-card:hover { transform: translateY(-5px); box-shadow: 0 10px 20px rgba(0,0,0,0.4); border-color: #f39c12; }

    .card-image-box {
      width: 100%; height: 240px; background: #121620; display: flex;
      align-items: center; justify-content: center; position: relative; padding: 10px;
    }

    .card-image-box img.can-img {
      max-width: 100%; max-height: 100%; object-fit: contain; filter: drop-shadow(0 5px 8px rgba(0,0,0,0.5));
    }

    /* Logo da cervejaria sobreposto com transparência */
    .brand-logo-badge {
      position: absolute; top: 10px; right: 10px; max-width: 50px; max-height: 35px; object-fit: contain;
      filter: drop-shadow(0 2px 4px rgba(0,0,0,0.8));
    }

    .card-content { padding: 16px; display: flex; flex-direction: column; gap: 6px; flex: 1; }

    .can-title { font-size: 0.95rem; font-weight: bold; color: #ffffff; line-height: 1.3; }
    .can-subtitle { font-size: 0.8rem; color: #f39c12; font-weight: bold; text-transform: uppercase; }

    .can-details {
      display: flex; justify-content: space-between; font-size: 0.75rem; color: #a0aec0; margin-top: auto; padding-top: 8px; border-top: 1px solid #2d3748;
    }

    /* Modal / Detalhes da Lata */
    .modal-overlay {
      position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.85);
      display: none; align-items: center; justify-content: center; z-index: 1000; padding: 20px;
    }
    .modal-overlay.active { display: flex; }

    .modal-card {
      background: #1a202c; border: 1px solid #f39c12; border-radius: 16px;
      width: 100%; max-width: 600px; padding: 24px; display: flex; flex-direction: column; gap: 16px;
      position: relative; max-height: 90vh; overflow-y: auto;
    }

    .close-modal {
      position: absolute; top: 16px; right: 16px; background: none; border: none;
      color: #a0aec0; font-size: 1.5rem; cursor: pointer; font-weight: bold;
    }
    .close-modal:hover { color: #f39c12; }

    .modal-gallery {
      display: flex; gap: 10px; overflow-x: auto; padding: 10px 0; scrollbar-width: thin;
    }
    .modal-gallery img {
      height: 220px; object-fit: contain; background: #121620; border-radius: 8px; padding: 8px; border: 1px solid #2d3748;
    }

    .empty-msg { text-align: center; color: #a0aec0; grid-column: 1 / -1; padding: 40px; font-size: 1.1rem; }
  </style>
</head>
<body>

  <header>
    <h1>WCCollection</h1>
    <div class="controls">
      <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar por nome, cervejaria ou país..." oninput="filterItems()">
      <button class="filter-btn active" onclick="setCategory('all', this)">Todas</button>
      <button class="filter-btn" onclick="setCategory('ococ', this)">OCOC (Países)</button>
      <button class="filter-btn" onclick="setCategory('sets', this)">Sets / Packs</button>
    </div>
  </header>

  <main class="catalog-grid" id="catalogGrid">
    <div class="empty-msg">Carregando catálogo...</div>
  </main>

  <!-- Modal para ver fotos e detalhes estendidos -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <div class="modal-card" onclick="event.stopPropagation()">
      <button class="close-modal" onclick="closeModal()">&times;</button>
      <h2 id="modalTitle" style="color: #f39c12; font-size: 1.3rem;"></h2>
      <div id="modalSub" style="color: #a0aec0; font-size: 0.9rem; font-weight: bold; text-transform: uppercase;"></div>
      
      <div class="modal-gallery" id="modalGallery"></div>

      <div id="modalInfo" style="font-size: 0.85rem; line-height: 1.6; color: #dddddd; border-top: 1px solid #2d3748; padding-top: 12px;"></div>
    </div>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwP4kTpSrGJllmlWjQp1YmD1Th5jiw1oUtX5cAJAZj9txy-eNi6_EYyLPG_Q0_coyT9/exec";
  let fullCatalog = [];
  let currentCategory = 'all';

  function getItemVal(item, keys) {
    if (!item) return "";
    for (let k of keys) {
      if (item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== "") {
        return item[k];
      }
    }
    return "";
  }

  async function loadCatalog() {
    try {
      const response = await fetch(API_URL + "?nocache=" + new Date().getTime());
      const data = await response.json();
      fullCatalog = Array.isArray(data) ? data : (data.data || []);
      filterItems();
    } catch (err) {
      console.error(err);
      document.getElementById("catalogGrid").innerHTML = `<div class="empty-msg" style="color:#e74c3c;">Erro ao carregar o catálogo.</div>`;
    }
  }

  function setCategory(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterItems();
  }

  function filterItems() {
    const search = document.getElementById("searchInput").value.toLowerCase().trim();

    const filtered = fullCatalog.filter(item => {
      const isSet = getItemVal(item, ["isSet", "IsSet", "isset"]) === true || String(getItemVal(item, ["isSet", "IsSet", "isset"])).toLowerCase() === 'true';
      const isOcoc = getItemVal(item, ["isOcoc", "IsOcoc", "isococ"]) === true || String(getItemVal(item, ["isOcoc", "IsOcoc", "isococ"])).toLowerCase() === 'true';

      if (currentCategory === 'ococ' && !isOcoc) return false;
      if (currentCategory === 'sets' && !isSet) return false;

      if (search) {
        const matchString = [
          getItemVal(item, ["Nome", "nome", "name"]),
          getItemVal(item, ["Cervejaria", "cervejaria", "brewery"]),
          getItemVal(item, ["Pais", "pais", "country"]),
          getItemVal(item, ["Volume", "volume"]),
          getItemVal(item, ["Ano", "ano"])
        ].join(" ").toLowerCase();

        if (matchString.indexOf(search) === -1) return false;
      }

      return true;
    });

    renderGrid(filtered);
  }

  function renderGrid(items) {
    const grid = document.getElementById("catalogGrid");
    grid.innerHTML = "";

    if (items.length === 0) {
      grid.innerHTML = `<div class="empty-msg">Nenhuma lata encontrada.</div>`;
      return;
    }

    items.forEach((item) => {
      const nome = getItemVal(item, ["Nome", "nome", "name"]) || "Lata Sem Nome";
      const cervejaria = getItemVal(item, ["Cervejaria", "cervejaria", "brewery"]);
      const pais = getItemVal(item, ["Pais", "pais", "country"]);
      const volume = getItemVal(item, ["Volume", "volume"]);
      const ano = getItemVal(item, ["Ano", "ano"]);

      // Fotos
      const logo = getItemVal(item, ["BRAND_LOGO", "brand_logo", "logo"]);
      const cover = getItemVal(item, ["ImgCover", "imgcover", "cover"]);
      const front = getItemVal(item, ["ImgFront", "imgfront", "front"]);
      
      const mainImg = cover || front || logo || "https://via.placeholder.com/200x240/1a202c/a0aec0?text=Sem+Foto";

      const card = document.createElement("div");
      card.className = "can-card";
      card.onclick = () => openModal(item);

      card.innerHTML = `
        <div class="card-image-box">
          <img src="${mainImg}" class="can-img" alt="${nome}" loading="lazy">
          ${logo ? `<img src="${logo}" class="brand-logo-badge" alt="Logo">` : ''}
        </div>
        <div class="card-content">
          <div class="can-subtitle">${cervejaria || 'Cervejaria'}</div>
          <div class="can-title">${nome}</div>
          <div class="can-details">
            <span>📍 ${pais || 'Global'}</span>
            <span>${volume ? volume : ''} ${ano ? '• ' + ano : ''}</span>
          </div>
        </div>
      `;

      grid.appendChild(card);
    });
  }

  function openModal(item) {
    const nome = getItemVal(item, ["Nome", "nome", "name"]);
    const cervejaria = getItemVal(item, ["Cervejaria", "cervejaria", "brewery"]);
    const pais = getItemVal(item, ["Pais", "pais", "country"]);
    const volume = getItemVal(item, ["Volume", "volume"]);
    const ano = getItemVal(item, ["Ano", "ano"]);
    const barcode = getItemVal(item, ["Barcode", "barcode"]);

    document.getElementById("modalTitle").innerText = nome;
    document.getElementById("modalSub").innerText = `${cervejaria} | ${pais}`;

    // Monta a galeria com todas as fotos que existirem
    const gallery = document.getElementById("modalGallery");
    gallery.innerHTML = "";

    const photos = [
      getItemVal(item, ["ImgFront", "imgfront", "front"]),
      getItemVal(item, ["ImgCover", "imgcover", "cover"]),
      getItemVal(item, ["ImgLeft", "imgleft", "left"]),
      getItemVal(item, ["ImgBack", "imgback", "back"]),
      getItemVal(item, ["ImgRight", "imgright", "right"])
    ].filter(p => p !== "");

    if (photos.length === 0) {
      gallery.innerHTML = `<p style="color:#a0aec0; font-size:0.8rem;">Sem fotos adicionais registradas.</p>`;
    } else {
      photos.forEach(url => {
        const img = document.createElement("img");
        img.src = url;
        gallery.appendChild(img);
      });
    }

    document.getElementById("modalInfo").innerHTML = `
      <p><strong>Volume:</strong> ${volume || 'N/A'}</p>
      <p><strong>Ano de Lançamento:</strong> ${ano || 'N/A'}</p>
      ${barcode ? `<p><strong>Código de Barras:</strong> ${barcode}</p>` : ''}
    `;

    document.getElementById("modalOverlay").classList.add("active");
  }

  function closeModal(e) {
    if (!e || e.target.id === "modalOverlay" || e.target.className === "close-modal") {
      document.getElementById("modalOverlay").classList.remove("active");
    }
  }

  window.onload = loadCatalog;
</script>
</body>
</html>
