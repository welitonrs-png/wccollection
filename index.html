<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WCCollection - Coleção de Latas</title>
  <style>
    :root {
      --bg-color: #121620;
      --card-bg: #1a202c;
      --border-color: #2d3748;
      --accent-color: #f39c12;
      --text-main: #ffffff;
      --text-sub: #a0aec0;
      --badge-lata: #1d3557;
      --badge-ococ: #1b4332;
      --badge-set: #3c096c;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; outline: none; }
    
    body {
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      padding: 30px 20px;
      display: flex;
      flex-direction: column;
      align-items: center;
    }

    header {
      width: 100%;
      max-width: 1300px;
      margin-bottom: 35px;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 20px;
    }

    .brand-title {
      font-size: 2.8rem;
      font-weight: 900;
      color: var(--accent-color);
      letter-spacing: 2px;
      text-transform: uppercase;
      text-shadow: 0 4px 15px rgba(243, 156, 18, 0.3);
    }

    .controls-container {
      width: 100%;
      max-width: 900px;
      display: flex;
      flex-wrap: wrap;
      gap: 15px;
      justify-content: center;
      align-items: center;
    }

    .search-box {
      position: relative;
      flex: 1;
      min-width: 280px;
    }

    .search-input {
      width: 100%;
      padding: 14px 22px;
      background: #1a202c;
      border: 1px solid var(--border-color);
      border-radius: 30px;
      color: #fff;
      font-size: 0.95rem;
      transition: all 0.3s ease;
      box-shadow: inset 0 2px 4px rgba(0,0,0,0.4);
    }

    .search-input:focus {
      border-color: var(--accent-color);
      box-shadow: 0 0 12px rgba(243, 156, 18, 0.4);
    }

    .filter-tabs {
      display: flex;
      gap: 10px;
      background: #161b26;
      padding: 6px;
      border-radius: 30px;
      border: 1px solid var(--border-color);
    }

    .tab-btn {
      padding: 10px 22px;
      background: transparent;
      border: none;
      border-radius: 20px;
      color: var(--text-sub);
      font-weight: 800;
      font-size: 0.85rem;
      cursor: pointer;
      text-transform: uppercase;
      transition: all 0.3s ease;
    }

    .tab-btn.active, .tab-btn:hover {
      background: var(--accent-color);
      color: #121620;
      box-shadow: 0 4px 12px rgba(243, 156, 18, 0.4);
    }

    /* Grid do Catálogo */
    .catalog-grid {
      width: 100%;
      max-width: 1300px;
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(240px, 1fr));
      gap: 25px;
      margin-bottom: 40px;
    }

    .can-card {
      background: var(--card-bg);
      border: 1px solid var(--border-color);
      border-radius: 16px;
      overflow: hidden;
      display: flex;
      flex-direction: column;
      position: relative;
      transition: transform 0.3s ease, box-shadow 0.3s ease, border-color 0.3s ease;
      cursor: pointer;
    }

    .can-card:hover {
      transform: translateY(-8px);
      border-color: var(--accent-color);
      box-shadow: 0 12px 25px rgba(0,0,0,0.6);
    }

    .card-photo-wrapper {
      width: 100%;
      height: 260px;
      background: radial-gradient(circle, #232a3b 0%, #121620 100%);
      display: flex;
      align-items: center;
      justify-content: center;
      position: relative;
      padding: 15px;
    }

    .card-photo-wrapper img.main-photo {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 8px 12px rgba(0,0,0,0.6));
      transition: transform 0.3s ease;
    }

    .can-card:hover img.main-photo {
      transform: scale(1.05);
    }

    .brand-logo-overlay {
      position: absolute;
      top: 12px;
      right: 12px;
      max-width: 55px;
      max-height: 40px;
      object-fit: contain;
      filter: drop-shadow(0 2px 6px rgba(0,0,0,0.8));
      z-index: 2;
    }

    .badge-type {
      position: absolute;
      top: 12px;
      left: 12px;
      padding: 4px 10px;
      border-radius: 6px;
      font-size: 0.65rem;
      font-weight: 900;
      text-transform: uppercase;
      z-index: 2;
    }
    .badge-lata { background: var(--badge-lata); color: #457b9d; border: 1px solid #457b9d; }
    .badge-ococ { background: var(--badge-ococ); color: #52b788; border: 1px solid #52b788; }
    .badge-set { background: var(--badge-set); color: #9d4edd; border: 1px solid #9d4edd; }

    .card-info {
      padding: 18px;
      display: flex;
      flex-direction: column;
      gap: 8px;
      flex: 1;
    }

    .brewery-name {
      font-size: 0.75rem;
      font-weight: 900;
      color: var(--accent-color);
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .can-name {
      font-size: 1rem;
      font-weight: 800;
      color: #ffffff;
      line-height: 1.35;
      display: -webkit-box;
      -webkit-line-clamp: 2;
      -webkit-box-orient: vertical;
      overflow: hidden;
    }

    .card-footer {
      margin-top: auto;
      padding-top: 12px;
      border-top: 1px solid rgba(255,255,255,0.08);
      display: flex;
      justify-content: space-between;
      align-items: center;
      font-size: 0.78rem;
      color: var(--text-sub);
      font-weight: 600;
    }

    /* ========================================================
       MODAL DE TELA CHEIA (IDENTICO À SUA IMAGEM)
       ======================================================== */
    .modal-overlay {
      position: fixed;
      top: 0;
      left: 0;
      width: 100vw;
      height: 100vh;
      background: #181d28; /* Fundo escuro total do app */
      display: none;
      z-index: 9999;
      padding: 40px 50px;
      overflow: hidden;
    }

    .modal-overlay.active {
      display: flex;
    }

    .btn-close-modal {
      position: absolute;
      top: 25px;
      left: 25px;
      background: #2a3447;
      border: none;
      color: #fff;
      width: 45px;
      height: 45px;
      border-radius: 50%;
      font-size: 1.5rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      z-index: 100;
      transition: background 0.2s;
    }
    .btn-close-modal:hover { background: var(--accent-color); color: #121620; }

    /* Logo no Canto Superior Direito bem maior */
    .modal-brand-logo-top {
      position: absolute;
      top: 30px;
      right: 50px;
      max-height: 110px; /* Logo maior */
      max-width: 220px;
      object-fit: contain;
      filter: drop-shadow(0 4px 10px rgba(0,0,0,0.5));
      z-index: 10;
    }

    /* Grid da Tela Cheia: Fotos na esquerda e Informações na direita */
    .modal-fullscreen-grid {
      width: 100%;
      height: 100%;
      display: grid;
      grid-template-columns: 380px 1fr;
      gap: 50px;
      align-items: center;
    }

    @media (max-width: 900px) {
      .modal-fullscreen-grid {
        grid-template-columns: 1fr;
        overflow-y: auto;
      }
      .modal-brand-logo-top { max-height: 70px; top: 15px; right: 20px; }
    }

    /* Coluna Esquerda: Galeria de Fotos */
    .gallery-container {
      display: flex;
      flex-direction: column;
      gap: 15px;
      height: 100%;
      justify-content: center;
    }

    .main-photo-box {
      width: 100%;
      height: 480px;
      background: transparent;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .main-photo-box img {
      max-width: 100%;
      max-height: 100%;
      object-fit: contain;
      filter: drop-shadow(0 10px 20px rgba(0,0,0,0.8));
    }

    .thumb-strip {
      display: flex;
      gap: 12px;
      justify-content: center;
    }

    .thumb-strip img {
      width: 65px;
      height: 80px;
      object-fit: contain;
      background: #11141d;
      border: 1px solid var(--border-color);
      border-radius: 8px;
      padding: 5px;
      cursor: pointer;
      opacity: 0.5;
      transition: all 0.2s;
    }

    .thumb-strip img.active, .thumb-strip img:hover {
      opacity: 1;
      border-color: var(--accent-color);
    }

    /* Coluna Direita: Informações com Texto Laranja e em Itálico (Igual à Imagem) */
    .info-container {
      display: flex;
      flex-direction: column;
      gap: 22px;
      justify-content: center;
      padding-right: 150px; /* Dá espaço para o logo da marca no topo */
    }

    .modal-main-title {
      color: var(--accent-color);
      font-size: 2.3rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      line-height: 1.15;
      letter-spacing: 0.5px;
    }

    .info-block {
      display: flex;
      flex-direction: column;
      gap: 2px;
    }

    .info-label {
      color: var(--accent-color);
      font-size: 1.1rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      letter-spacing: 0.5px;
    }

    .info-val {
      color: var(--accent-color);
      font-size: 2.2rem;
      font-weight: 900;
      font-style: italic;
      text-transform: uppercase;
      line-height: 1.1;
      letter-spacing: 0.5px;
    }

    .counter-badge {
      position: absolute;
      bottom: 30px;
      right: 50px;
      color: var(--accent-color);
      font-size: 1.2rem;
      font-weight: 900;
      font-style: italic;
    }

    .empty-state {
      grid-column: 1 / -1;
      text-align: center;
      padding: 60px 20px;
      color: var(--text-sub);
      font-size: 1.1rem;
    }
  </style>
</head>
<body>

  <header>
    <div class="brand-title">WCCollection</div>
    
    <div class="controls-container">
      <div class="search-box">
        <input type="text" id="searchInput" class="search-input" placeholder="Pesquisar por nome, cervejaria, país..." oninput="filterCatalog()">
      </div>

      <div class="filter-tabs">
        <button class="tab-btn active" onclick="setFilter('all', this)">Todas</button>
        <button class="tab-btn" onclick="setFilter('ococ', this)">OCOC (Países)</button>
        <button class="tab-btn" onclick="setFilter('sets', this)">Sets / Packs</button>
      </div>
    </div>
  </header>

  <main class="catalog-grid" id="catalogGrid">
    <div class="empty-state">Carregando catálogo completo...</div>
  </main>

  <!-- Modal Tela Cheia Fiel à Imagem -->
  <div class="modal-overlay" id="modalOverlay" onclick="closeModal(event)">
    <button class="btn-close-modal" onclick="closeModal()">&times;</button>
    
    <!-- Logo da Cervejaria Grande no Canto Superior Direito -->
    <img id="modalBrandLogo" class="modal-brand-logo-top" src="" alt="" style="display:none;">

    <div class="modal-fullscreen-grid" onclick="event.stopPropagation()">
      <!-- Fotos na Esquerda -->
      <div class="gallery-container">
        <div class="main-photo-box">
          <img id="modalMainPhoto" src="" alt="Foto Principal">
        </div>
        <div class="thumb-strip" id="modalThumbStrip"></div>
      </div>

      <!-- Textos em Laranja e Itálico na Direita -->
      <div class="info-container">
        <div class="modal-main-title" id="modalTitle">---</div>

        <div class="info-block">
          <span class="info-label">ORIGEM:</span>
          <span class="info-val" id="modalCountry">---</span>
        </div>

        <div class="info-block">
          <span class="info-label">VOLUME:</span>
          <span class="info-val" id="modalVolume">---</span>
        </div>

        <div class="info-block">
          <span class="info-label">ANO:</span>
          <span class="info-val" id="modalYear">---</span>
        </div>

        <div class="info-block">
          <span class="info-label">CÓD. BARRAS:</span>
          <span class="info-val" id="modalBarcode">---</span>
        </div>
      </div>
    </div>

    <div class="counter-badge" id="modalCounter">1/1</div>
  </div>

<script>
  const API_URL = "https://script.google.com/macros/s/AKfycbwP4kTpSrGJllmlWjQp1YmD1Th5jiw1oUtX5cAJAZj9txy-eNi6_EYyLPG_Q0_coyT9/exec";
  
  let rawCatalog = [];
  let currentCategory = 'all';

  function getItemVal(item, keys) {
    if (!item) return "";
    for (let k of keys) {
      if (item[k] !== undefined && item[k] !== null && String(item[k]).trim() !== "") {
        return item[k];
      }
    }
    return "";
  }

  async function fetchCatalogData() {
    try {
      const response = await fetch(API_URL + "?nocache=" + new Date().getTime());
      const data = await response.json();
      rawCatalog = Array.isArray(data) ? data : (data.data || []);
      filterCatalog();
    } catch (err) {
      console.error(err);
      document.getElementById("catalogGrid").innerHTML = `<div class="empty-state" style="color:#e74c3c;">Falha ao carregar os dados do servidor.</div>`;
    }
  }

  function setFilter(cat, btn) {
    currentCategory = cat;
    document.querySelectorAll('.tab-btn').forEach(b => b.classList.remove('active'));
    btn.classList.add('active');
    filterCatalog();
  }

  function filterCatalog() {
    const term = document.getElementById("searchInput").value.toLowerCase().trim();

    const filtered = rawCatalog.filter(item => {
      const isSet = getItemVal(item, ["isSet", "IsSet", "isset"]) === true || String(getItemVal(item, ["isSet", "IsSet", "isset"])).toLowerCase() === 'true';
      const isOcoc = getItemVal(item, ["isOcoc", "IsOcoc", "isococ"]) === true || String(getItemVal(item, ["isOcoc", "IsOcoc", "isococ"])).toLowerCase() === 'true';

      if (currentCategory === 'ococ' && !isOcoc) return false;
      if (currentCategory === 'sets' && !isSet) return false;

      if (term) {
        const fullSearchString = [
          getItemVal(item, ["Nome", "nome", "name"]),
          getItemVal(item, ["Cervejaria", "cervejaria", "brewery"]),
          getItemVal(item, ["Pais", "pais", "country"]),
          getItemVal(item, ["Volume", "volume"]),
          getItemVal(item, ["Ano", "ano"])
        ].join(" ").toLowerCase();

        if (fullSearchString.indexOf(term) === -1) return false;
      }

      return true;
    });

    renderGrid(filtered);
  }

  function renderGrid(items) {
    const grid = document.getElementById("catalogGrid");
    grid.innerHTML = "";

    if (items.length === 0) {
      grid.innerHTML = `<div class="empty-state">Nenhuma lata encontrada.</div>`;
      return;
    }

    items.forEach((item) => {
      const nome = getItemVal(item, ["Nome", "nome", "name"]) || "Lata sem título";
      const cervejaria = getItemVal(item, ["Cervejaria", "cervejaria", "brewery"]) || "Marca Desconhecida";
      const pais = getItemVal(item, ["Pais", "pais", "country"]) || "Desconhecido";
      const volume = getItemVal(item, ["Volume", "volume"]);
      const ano = getItemVal(item, ["Ano", "ano"]);

      const isSet = getItemVal(item, ["isSet", "IsSet", "isset"]) === true || String(getItemVal(item, ["isSet", "IsSet", "isset"])).toLowerCase() === 'true';
      const isOcoc = getItemVal(item, ["isOcoc", "IsOcoc", "isococ"]) === true || String(getItemVal(item, ["isOcoc", "IsOcoc", "isococ"])).toLowerCase() === 'true';

      let badgeHtml = '<span class="badge-type badge-lata">LATA</span>';
      if (isSet) badgeHtml = '<span class="badge-type badge-set">SET</span>';
      else if (isOcoc) badgeHtml = '<span class="badge-type badge-ococ">OCOC</span>';

      const logo = getItemVal(item, ["BRAND_LOGO", "brand_logo", "logo"]);
      const cover = getItemVal(item, ["ImgCover", "imgcover", "cover"]);
      const front = getItemVal(item, ["ImgFront", "imgfront", "front"]);

      const mainImg = cover || front || logo || "https://via.placeholder.com/200x260/1a202c/a0aec0?text=Sem+Imagem";

      const card = document.createElement("div");
      card.className = "can-card";
      card.onclick = () => openModal(item);

      card.innerHTML = `
        <div class="card-photo-wrapper">
          ${badgeHtml}
          ${logo ? `<img src="${logo}" class="brand-logo-overlay" alt="Logo">` : ''}
          <img src="${mainImg}" class="main-photo" alt="${nome}" loading="lazy">
        </div>
        <div class="card-info">
          <div class="brewery-name">${cervejaria}</div>
          <div class="can-name">${nome}</div>
          <div class="card-footer">
            <span>📍 ${pais}</span>
            <span>${volume ? volume : ''} ${ano ? '• ' + ano : ''}</span>
          </div>
        </div>
      `;

      grid.appendChild(card);
    });
  }

  function openModal(item) {
    const nome = getItemVal(item, ["Nome", "nome", "name"]);
    const pais = getItemVal(item, ["Pais", "pais", "country"]);
    const volume = getItemVal(item, ["Volume", "volume"]);
    const ano = getItemVal(item, ["Ano", "ano"]);
    const barcode = getItemVal(item, ["Barcode", "barcode"]);
    const logo = getItemVal(item, ["BRAND_LOGO", "brand_logo", "logo"]);

    document.getElementById("modalTitle").innerText = nome || "SEM NOME";
    document.getElementById("modalCountry").innerText = pais || "---";
    document.getElementById("modalVolume").innerText = volume || "---";
    document.getElementById("modalYear").innerText = ano || "---";
    document.getElementById("modalBarcode").innerText = barcode || "---";

    const brandLogoEl = document.getElementById("modalBrandLogo");
    if (logo) {
      brandLogoEl.src = logo;
      brandLogoEl.style.display = "block";
    } else {
      brandLogoEl.style.display = "none";
    }

    // Monta a galeria de fotos e miniaturas
    const photos = [
      getItemVal(item, ["ImgFront", "imgfront", "front"]),
      getItemVal(item, ["ImgCover", "imgcover", "cover"]),
      getItemVal(item, ["ImgLeft", "imgleft", "left"]),
      getItemVal(item, ["ImgBack", "imgback", "back"]),
      getItemVal(item, ["ImgRight", "imgright", "right"])
    ].filter(p => p !== "");

    const mainPhotoEl = document.getElementById("modalMainPhoto");
    const thumbStrip = document.getElementById("modalThumbStrip");
    const counterEl = document.getElementById("modalCounter");
    thumbStrip.innerHTML = "";

    if (photos.length > 0) {
      mainPhotoEl.src = photos[0];
      counterEl.innerText = `1/${photos.length}`;

      photos.forEach((url, idx) => {
        const img = document.createElement("img");
        img.src = url;
        if (idx === 0) img.className = "active";
        
        img.onclick = () => {
          mainPhotoEl.src = url;
          counterEl.innerText = `${idx + 1}/${photos.length}`;
          document.querySelectorAll("#modalThumbStrip img").forEach(t => t.classList.remove("active"));
          img.classList.add("active");
        };

        thumbStrip.appendChild(img);
      });
    } else {
      mainPhotoEl.src = "https://via.placeholder.com/300x400/1a202c/a0aec0?text=Sem+Foto";
      counterEl.innerText = "0/0";
    }

    document.getElementById("modalOverlay").classList.add("active");
  }

  function closeModal(e) {
    if (!e || e.target.id === "modalOverlay" || e.target.className === "btn-close-modal") {
      document.getElementById("modalOverlay").classList.remove("active");
    }
  }

  window.onload = fetchCatalogData;
</script>
</body>
</html>
