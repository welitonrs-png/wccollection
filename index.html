<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>WCCollection - Universal SPA</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>

  <!-- SPLASH SCREEN -->
  <div class="loading-screen" id="loadingScreen">
    <img src="logo.png" alt="Logo" class="loading-logo">
    <div class="spinner"></div>
    <div class="loading-text" id="loadingText">CARREGANDO CATÁLOGO...</div>
  </div>

  <div class="app-container">
    <button class="mobile-menu-btn" onclick="toggleMenuMobile(event)">☰</button>

    <nav class="sidebar-drawer" id="sidebarDrawer">
      <img src="logo.png" alt="Logo" class="sidebar-logo">
      <button class="cat-btn" id="menuBtnHome" onclick="switchTab('home')" tabindex="0">HOME / CATÁLOGO</button>
      
      <button class="cat-btn" id="menuBtnSearch" onclick="toggleSearchInline()" tabindex="0">PESQUISAR</button>
      <div class="inline-panel-container" id="searchInlineContainer">
        <input type="text" id="menuSearchInput" class="menu-search-box" placeholder="DIGITE PARA BUSCAR..." readonly tabindex="-1">
        <div class="vk-container" id="vkContainer"></div>
      </div>

      <button class="cat-btn" id="menuBtnBrands" onclick="toggleBrandInline()" tabindex="0">MARCAS</button>
      <div class="inline-panel-container" id="brandInlineList"></div>

      <button class="cat-btn" id="menuBtnOcoc" onclick="switchTab('ococ')" tabindex="0">OCOC (PAÍSES)</button>
      <button class="cat-btn" id="menuBtnSets" onclick="switchTab('sets')" tabindex="0">SETS & PACKS</button>
    </nav>

    <main class="main-area" id="mainArea" onclick="handleMainAreaClick()">
      <section class="hero-panel" id="heroPanel">
        <div class="hero-brand-logo-container" id="heroBrandLogo"></div>

        <div class="hero-left-photos" id="heroPhotos">
          <div class="hero-photo-card"><img src="" alt=""></div>
          <div class="hero-photo-card"><img src="" alt=""></div>
          <div class="hero-photo-card"><img src="" alt=""></div>
          <div class="hero-photo-card"><img src="" alt=""></div>
        </div>

        <div class="hero-right-info">
          <div class="hero-title" id="heroTitle">SELECIONE UMA LATA</div>
          <div class="info-block"><span class="info-label" id="labelCountry">ORIGEM:</span><div class="info-val" id="heroCountry">-</div></div>
          <div class="info-block"><span class="info-label">VOLUME:</span><div class="info-val" id="heroVolume">-</div></div>
          <div class="info-block"><span class="info-label">ANO:</span><div class="info-val" id="heroYear">-</div></div>
          <div class="info-block"><span class="info-label">CÓD. BARRAS:</span><div class="info-val" id="heroBarcode">-</div></div>
        </div>
      </section>

      <div class="counter-bar"><div class="card-counter" id="cardCounter">0/0</div></div>

      <section class="catalog-section" id="catalogSection">
        <div class="card-row" id="cardRow"></div>
      </section>
    </main>
  </div>

  <!-- MODAL DE ZOOM -->
  <div class="zoom-modal" id="zoomModal" onclick="closeZoomModal()">
    <img id="zoomImage" src="" alt="Imagem ampliada" onclick="event.stopPropagation(); toggleZoomStep();">
  </div>

  <!-- MODAL DE SAÍDA -->
  <div class="exit-modal" id="exitModal">
    <div class="exit-box">
      <div class="exit-title">TEM CERTEZA QUE QUER SAIR?</div>
      <div class="exit-buttons">
        <button class="exit-btn" id="exitBtnNo" onclick="closeExitModal()">NÃO</button>
        <button class="exit-btn" id="exitBtnYes" onclick="confirmExit()">SIM</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
