<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">

  <title>WCCollection - Universal SPA (Marcas)</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; outline: none; }
    
    body { background-color: #1a1e29; color: #DDDDDD; height: 100vh; overflow: hidden; display: flex; user-select: none; touch-action: pan-y; }

    ::-webkit-scrollbar { display: none !important; width: 0 !important; height: 0 !important; }
    * { -ms-overflow-style: none !important; scrollbar-width: none !important; }

    .app-container { display: flex; width: 100vw; height: 100vh; overflow: hidden; position: relative; background-color: #1a1e29; }

    /* TELA DE CARREGAMENTO (SPLASH SCREEN) */
    .loading-screen {
      position: fixed; top: 0; left: 0; width: 100vw; height: 100vh;
      background-color: #1a1e29; z-index: 9999; display: flex;
      flex-direction: column; justify-content: center; align-items: center; gap: 20px;
      transition: opacity 0.5s ease, visibility 0.5s ease;
    }

    .loading-screen.hidden { opacity: 0; visibility: hidden; pointer-events: none; }

    .loading-logo { width: 180px; height: auto; object-fit: contain; animation: pulse 1.5s infinite ease-in-out; }

    .loading-text { color: #f39c12; font-size: 1.1rem; font-weight: 800; letter-spacing: 2px; text-transform: uppercase; }

    .spinner {
      width: 40px; height: 40px;
      border: 4px solid rgba(243, 156, 18, 0.2);
      border-top: 4px solid #f39c12; border-radius: 50%;
      animation: spin 1s linear infinite;
    }

    @keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
    @keyframes pulse { 0%, 100% { transform: scale(1); opacity: 0.9; } 50% { transform: scale(1.05); opacity: 1; } }

    /* BOTÃO HAMBÚRGUER (EXCLUSIVO PARA CELULAR) */
    .mobile-menu-btn {
      display: none; position: fixed; top: 12px; left: 12px; z-index: 2000;
      background: rgba(26, 32, 46, 0.9); color: #f39c12; border: 1px solid #f39c12;
      font-size: 1.5rem; padding: 6px 12px; border-radius: 8px; cursor: pointer;
    }

    @media (max-width: 768px) {
      .mobile-menu-btn { display: block; }
    }

    /* MENU GAVETA DESLIZANTE */
    .sidebar-drawer {
      position: absolute; top: 0; left: -280px; width: 260px; height: 100vh;
      background: rgba(22, 27, 38, 0.98); backdrop-filter: blur(10px);
      display: flex; flex-direction: column; padding: 30px 16px; gap: 8px;
      z-index: 1000; border-right: 1px solid rgba(255,255,255,0.08);
      transition: left 0.25s cubic-bezier(0.1, 0.9, 0.2, 1); overflow-y: auto;
      box-shadow: 10px 0 30px rgba(0,0,0,0.6);
    }
    
    .sidebar-drawer.open { left: 0; }

    .sidebar-logo { width: 100%; height: 50px; object-fit: contain; margin-bottom: 16px; text-align: center; }

    /* BOTÕES DO MENU */
    .cat-btn {
      display: flex; align-items: center; width: 100%; padding: 12px 18px; border-radius: 12px;
      background: transparent; color: #e2e8f0; font-size: 1.05rem; font-weight: 600; border: none;
      text-align: left; cursor: pointer; transition: all 0.15s ease; text-transform: uppercase !important;
    }

    .cat-btn:focus, .cat-btn.focused, .cat-btn:hover {
      background: #ffffff !important; color: #1a1f2c !important; font-weight: 700 !important;
      box-shadow: 0 4px 15px rgba(255, 255, 255, 0.2); outline: none !important;
    }

    .inline-panel-container { display: none; flex-direction: column; gap: 4px; padding: 6px 0; }
    .inline-panel-container.active { display: flex; }

    .brand-btn { 
      font-size: 0.85rem; padding: 8px 12px; border-radius: 8px; background: transparent; color: #a0aec0; cursor: pointer; 
      border: none !important; text-align: left; font-weight: 600; text-transform: uppercase !important; white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
    }
    .brand-btn:focus, .brand-btn:hover { color: #ffffff !important; background: rgba(255,255,255,0.1) !important; }

    .menu-search-box { width: 100%; padding: 8px; background: #11141d; border: 1px solid #333d52; border-radius: 8px; color: #fff; font-size: 0.8rem; text-align: center; text-transform: uppercase; margin-bottom: 4px; pointer-events: none; }
    .vk-container { display: grid; grid-template-columns: repeat(6, 1fr); gap: 2px; }
    .vk-key { background: #11141d; border: 1px solid #2a3447; color: #a0aec0; padding: 8px 0; border-radius: 4px; font-size: 0.75rem; font-weight: bold; cursor: pointer; text-align: center; user-select: none; }
    .vk-key:focus, .vk-key:hover { color: #fff; border-color: #fff; background: rgba(255,255,255,0.2); }
    .vk-key-wide { grid-column: span 2; }

    /* ÁREA PRINCIPAL */
    .main-area {
      flex: 1; display: flex; flex-direction: column; height: 100vh; padding: 10px 16px; gap: 6px;
      overflow: hidden; background: #1a1e29; min-width: 0;
      transition: transform 0.25s cubic-bezier(0.1, 0.9, 0.2, 1);
    }
    .main-area.pushed { transform: translateX(260px); }

    /* ÁREA SUPERIOR COM BUSCA E WALLPAPER */
    .hero-panel { 
      flex: 1; min-height: 0; background: transparent; border-radius: 12px; 
      display: flex; padding: 8px 12px; position: relative; align-items: flex-start; justify-content: flex-start;
      overflow: hidden;
    }

    /* CAMADA DE WALLPAPER DA MARCA */
    .hero-brand-wallpaper {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background-size: cover;
      background-position: center;
      background-repeat: no-repeat;
      opacity: 0;
      transition: opacity 0.5s ease-in-out;
      z-index: 1;
      pointer-events: none;
    }

    .hero-brand-wallpaper.active {
      opacity: 0.25;
    }

    .hero-panel::after {
      content: '';
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: linear-gradient(180deg, rgba(26, 30, 41, 0.4) 0%, rgba(26, 30, 41, 0.95) 100%);
      z-index: 2;
      pointer-events: none;
    }

    .brand-search-wrapper {
      position: relative;
      width: 320px;
      max-width: 60%;
      z-index: 30;
    }

    .brand-search-input {
      width: 100%;
      padding: 10px 16px;
      background: #11141d;
      border: 2px solid #333d52;
      border-radius: 8px;
      color: #f39c12;
      font-size: 0.95rem;
      font-weight: 700;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      transition: border-color 0.2s ease, box-shadow 0.2s ease;
    }

    .brand-search-input:focus, .brand-search-input.focused {
      border-color: #f39c12;
      box-shadow: 0 0 10px rgba(243, 156, 18, 0.3);
      outline: none;
    }

    .autocomplete-dropdown {
      position: absolute;
      top: calc(100% + 4px);
      left: 0;
      width: 100%;
      max-height: 180px;
      background: rgba(17, 20, 29, 0.98);
      border: 1px solid #333d52;
      border-radius: 8px;
      overflow-y: auto;
      display: none;
      box-shadow: 0 8px 20px rgba(0, 0, 0, 0.6);
      z-index: 100;
    }

    .autocomplete-dropdown.active {
      display: flex;
      flex-direction: column;
    }

    .autocomplete-item {
      padding: 10px 14px;
      font-size: 0.85rem;
      font-weight: 700;
      color: #a0aec0;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s ease, color 0.15s ease;
    }

    .autocomplete-item:hover, .autocomplete-item.active {
      background: #f39c12;
      color: #1a1e29;
    }

    .hero-brand-logo-container {
      position: absolute; top: 8px; right: 20px; width: 180px; height: 80px;
      display: flex; justify-content: flex-end; align-items: flex-start; z-index: 20; pointer-events: none;
    }
    .hero-brand-logo-container img { max-width: 100%; max-height: 100%; object-fit: contain; }

    /* BARRA DO MEIO COM O BOTÃO TRIÂNGULO AO LADO DA CONTAGEM */
    .counter-bar { display: flex; justify-content: flex-end; align-items: center; padding: 0 4px; gap: 8px; height: 20px; }
    
    .sort-icon-btn {
      background: transparent; color: #a0aec0; border: none; font-size: 0.9rem;
      cursor: pointer; padding: 0; display: flex; align-items: center;
      justify-content: center; transition: color 0.2s ease, transform 0.2s ease; outline: none;
    }
    
    .sort-icon-btn:hover, .sort-icon-btn:focus, .sort-icon-btn.focused {
      color: #f39c12 !important; background: transparent !important;
      border: none !important; box-shadow: none !important; transform: scale(1.25);
    }

    .card-counter { font-size: 0.85rem; font-weight: 900; color: #f39c12; background: transparent; padding: 0; letter-spacing: 1px; }

    /* SEÇÃO INFERIOR DO CATÁLOGO - 2 LINHAS */
    .catalog-section { height: 380px; min-height: 380px; width: 100%; overflow: hidden; flex-shrink: 0; touch-action: none; }
    .card-row { display: grid; grid-template-columns: repeat(7, 122px); grid-template-rows: repeat(2, 185px); gap: 10px 12px; width: 100%; height: 100%; justify-content: start; align-content: start; }

    .card {
      width: 122px !important;
      min-width: 122px !important;
      height: 185px !important;
      background: #ffffff !important;
      border-radius: 10px !important;
      overflow: hidden !important;
      display: flex !important;
      flex-direction: column !important;
      border: 2px solid transparent !important;
      cursor: pointer !important;
      flex-shrink: 0 !important;
    }

    .card.card-aspect-sets { width: 170px !important; min-width: 170px !important; }

    .card-top-photo {
      width: 100% !important;
      height: 137px !important;
      background: #ffffff !important;
      display: flex !important;
      justify-content: center !important;
      align-items: center !important;
      padding: 4px !important;
    }

    .card-top-photo img {
      max-width: 100% !important;
      max-height: 100% !important;
      object-fit: contain !important;
    }

    .card-bottom-bar {
      width: 100% !important;
      height: 48px !important;
      padding: 2px 5px 3px 5px !important;
      display: flex !important;
      flex-direction: column !important;
      justify-content: space-between !important;
      box-sizing: border-box !important;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif !important;
    }

    .card-bar-title {
      font-family: "Helvetica Now Display", "Helvetica Neue", Helvetica, Arial, sans-serif !important;
      font-size: 0.75rem !important;
      font-weight: 700 !important;
      color: #ffffff !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-overflow: ellipsis !important;
      text-transform: capitalize !important;
      line-height: 1.1 !important;
      margin-top: 3px !important;
    }

    .card-bar-details {
      display: flex !important;
      justify-content: space-between !important;
      align-items: center !important;
      width: 100% !important;
      margin-bottom: 1px !important;
    }

    .card-bar-country {
      display: flex !important;
      align-items: center !important;
      gap: 3px !important;
      font-family: Helvetica, Arial, sans-serif !important;
      font-size: 0.60rem !important;
      font-weight: 400 !important;
      color: #ffffff !important;
      white-space: nowrap !important;
      overflow: hidden !important;
      text-transform: capitalize !important;
    }

    .card-bar-flag {
      width: 13px !important;
      height: 8px !important;
      object-fit: cover !important;
      border-radius: 2px !important;
      flex-shrink: 0 !important;
    }

    .card-bar-vol {
      background: rgba(0, 0, 0, 0.45) !important;
      color: #ffffff !important;
      font-family: Helvetica, Arial, sans-serif !important;
      padding: 1px 4px !important;
      border-radius: 4px !important;
      font-size: 0.55rem !important;
      font-weight: 400 !important;
      white-space: nowrap !important;
      flex-shrink: 0 !important;
    }

    .card.focused, .card:hover { 
      border: 2px solid #f39c12 !important; 
      box-shadow: 0 0 8px rgba(243, 156, 18, 0.4) !important; 
      outline: none !important; 
      z-index: 10 !important; 
    }

    /* MODAL DE ZOOM E NAVEGAÇÃO */
    .zoom-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.95); z-index: 3000; display: none; justify-content: center; align-items: center; padding: 16px; overflow: hidden; }
    .zoom-modal.active { display: flex; }
    .zoom-modal img { 
      max-width: 85vw; max-height: 85vh; object-fit: contain; border-radius: 6px; cursor: pointer; 
      transition: transform 0.15s ease-out; transform-origin: center center; 
    }

    /* MODAL VISUAL DE SAÍDA NATIVO */
    .exit-modal { position: fixed; top: 0; left: 0; width: 100vw; height: 100vh; background: rgba(0,0,0,0.85); z-index: 4000; display: none; justify-content: center; align-items: center; }
    .exit-modal.active { display: flex; }
    .exit-box { background: #161b26; border: 2px solid #333d52; padding: 30px 40px; border-radius: 12px; display: flex; flex-direction: column; align-items: center; gap: 24px; box-shadow: 0 10px 30px rgba(0,0,0,0.8); }
    .exit-title { color: #f39c12; font-size: 1.3rem; font-weight: 800; text-transform: uppercase; letter-spacing: 1px; }
    .exit-buttons { display: flex; gap: 16px; }

    .exit-btn:focus, .exit-btn:hover { background: #ffffff; color: #1a1f2c; box-shadow: 0 0 15px rgba(255,255,255,0.3); outline: none; }
  </style>

// Converte links de compartilhamento do Google Drive para links diretos de imagem
function fixDriveUrl(url) {
  if (!url) return '';
  const str = String(url).trim();
  const match = str.match(/\/d\/([^\/\?]+)/);
  if (match && match[1]) {
    return `https://lh3.googleusercontent.com/d/${match[1]}`;
  }
  return str;
}

// Substitua a sua getOptimizedImageUrl antiga por esta:

  if (!url) return '';

    return cleanUrl.split('=')[0] + `=s${size}-rw`;
  }
  return cleanUrl;
}

  function preloadFirstImages(items, count = 14) {
    return new Promise((resolve) => {
      const pageItems = items.slice(0, count);
      if (pageItems.length === 0) {
        resolve();
        return;
      }

      let loadedCount = 0;
      const totalToLoad = pageItems.length;

      pageItems.forEach((can) => {
        const rawCover = can.ImgFront || can.front || can.ImgCover || can.cover;

        if (!rawCover) {
          loadedCount++;
          if (loadedCount >= totalToLoad) resolve();
          return;
        }

        const img = new Image();
        img.src = getOptimizedImageUrl(rawCover, 300);
        img.onload = img.onerror = () => {
          loadedCount++;
          if (loadedCount >= totalToLoad) {
            resolve();
          }
        };
      });

      setTimeout(resolve, 3500);
    });
  }

  function hideLoadingScreen() {
    const screen = document.getElementById("loadingScreen");
    if (screen) {
      screen.classList.add("hidden");
    }
  }

  async function fetchCatalogFromSheet() {
    if(!API_URL || API_URL.includes("COLE_AQUI")) return;

    localStorage.removeItem("beercan_catalog_cache");

    try {
      const response = await fetch(API_URL + "?nocache=" + new Date().getTime());
      const freshData = await response.json();
      
      canCatalog = freshData;
      extractRegisteredBrands();
      processTabChange();

      document.getElementById("loadingText").innerText = "PREPARANDO IMAGENS...";
      await preloadFirstImages(currentFiltered, cardsPerPage);
      hideLoadingScreen();
      focusCardSafely(0);
    } catch (err) {
      console.error("Erro ao carregar catálogo da API:", err);
      hideLoadingScreen();
      focusCardSafely(0);
    }
  }

  function extractRegisteredBrands() {
    const brandSet = new Set();
    canCatalog.forEach(can => {
      const b = can.brewery || can.Cervejaria;
      if (b && String(b).trim() !== "") {
        brandSet.add(String(b).trim());
      }
    });
    registeredBrands = Array.from(brandSet).sort((a, b) => a.localeCompare(b));
  }

  function switchTab(tabName) {
    currentTab = tabName;
    lastSelectedBrandElem = null;
    
    if(tabName === 'home') lastSelectedMenuId = 'menuBtnHome';
    else if(tabName === 'ococ') lastSelectedMenuId = 'menuBtnOcoc';
    else if(tabName === 'sets') lastSelectedMenuId = 'menuBtnSets';

    document.getElementById("menuSearchInput").value = "";
    document.getElementById("searchInlineContainer").classList.remove("active");
    document.getElementById("brandInlineList").classList.remove("active");
    
    processTabChange();
    focusCardSafely(0);
  }

  function toggleSortOrder() {
    sortNewestFirst = !sortNewestFirst;
    const sortBtn = document.getElementById("sortOrderBtn");
    if (sortNewestFirst) {
      sortBtn.innerText = "▼";
      sortBtn.title = "Ordenação: Maior para Menor (Mais Novos)";
    } else {
      sortBtn.innerText = "▲";
      sortBtn.title = "Ordenação: Menor para Maior (Mais Antigos)";
    }

    const currentSearchVal = document.getElementById("topBrandInput").value;
    filterCatalogByBrand(currentSearchVal);
    focusCardSafely(0);
  }

  function processTabChange() {
    buildBrandList();
    buildVirtualKeyboard();
    const currentSearchVal = document.getElementById("topBrandInput").value;
    filterCatalogByBrand(currentSearchVal);
  }

  function getBaseListForCurrentTab() {
    let list = [];
    if (currentTab === 'home') {
      list = canCatalog.filter(can => {
        const val = can.isSet !== undefined ? can.isSet : can.isSet;
        return !val || String(val).toLowerCase() === "false";
      });
    } else if (currentTab === 'ococ') {
      const countryMap = new Map();
      canCatalog.forEach(can => {
        const countryVal = can.brewery || can.Cervejaria;
        const isOcocVal = can.isOcoc;
        const isSetVal = can.isSet;

        if ((!isSetVal || String(isSetVal).toLowerCase() === "false") && 
            (isOcocVal === true || String(isOcocVal).toLowerCase() === "true") && 
            countryVal && !countryMap.has(String(countryVal).toLowerCase())) {
          countryMap.set(String(countryVal).toLowerCase(), can);
        }
      });
      list = Array.from(countryMap.values()).sort((a,b) => String(a.country || a.Pais).localeCompare(String(b.country || b.Pais)));
    } else if (currentTab === 'sets') {
      list = canCatalog.filter(can => {
        const val = can.isSet;
        return val === true || String(val).toLowerCase() === "true";
      });
    }

    if (sortNewestFirst && currentTab !== 'ococ') {
      return [...list].reverse();
    }
    return list;
  }

  /* LIMPA FOCOS DUPLOS MANTENDO O FOCO NO INPUT DE BUSCA SE TIVER DIGITANDO */
  function clearAllCardFocus() {
    const topInput = document.getElementById("topBrandInput");
    
    if (document.activeElement && document.activeElement !== topInput && typeof document.activeElement.blur === "function") {
      document.activeElement.blur();
    }

    document.querySelectorAll(".card").forEach(c => {
      c.classList.remove("focused");
    });

    const sortBtn = document.getElementById("sortOrderBtn");
    if (sortBtn) sortBtn.classList.remove("focused");

    if (topInput && document.activeElement !== topInput) {
      topInput.classList.remove("focused");
    }
  }

  function focusCardSafely(targetIndex) {
    closeMenu();
    clearAllCardFocus();
    
    setTimeout(() => {
      const cards = document.querySelectorAll(".card");
      if (cards.length > 0) {
        const finalIdx = Math.min(targetIndex, cards.length - 1);
        activeLocalIndex = finalIdx;
        cards[finalIdx].classList.add("focused");
        cards[finalIdx].focus();
        updateCounter(finalIdx);
      }
    }, 50);
  }

  function openMenu() {
    document.getElementById("sidebarDrawer").classList.add("open");
    document.getElementById("mainArea").classList.add("pushed");
    
    if (lastSelectedMenuId === 'menuBtnBrands') {
      const brandContainer = document.getElementById("brandInlineList");
      brandContainer.classList.add("active");

      if (lastSelectedBrandElem && brandContainer.contains(lastSelectedBrandElem)) {
        lastSelectedBrandElem.focus();
        return;
      } else {
        const firstBrand = brandContainer.querySelector(".brand-btn");
        if (firstBrand) {
          firstBrand.focus();
          return;
        }
      }
    }

    const targetElem = document.getElementById(lastSelectedMenuId);
    if (targetElem) {
      targetElem.focus();
    } else {
      document.getElementById("menuBtnHome").focus();
    }
  }

  function closeMenu() {
    document.getElementById("sidebarDrawer").classList.remove("open");
    document.getElementById("mainArea").classList.remove("pushed");
  }

  function toggleMenuMobile(e) {
    if(e) e.stopPropagation();
    const drawer = document.getElementById("sidebarDrawer");
    if (drawer.classList.contains("open")) {
      closeMenu();
    } else {
      openMenu();
    }

  function buildVirtualKeyboard() {
    const container = document.getElementById("vkContainer");
    container.innerHTML = "";
    vkKeys.forEach((k, index) => {
      const btn = document.createElement("button");
      btn.className = `vk-key ${ (k === 'ESPAÇO' || k === 'DEL' || k === 'LIMPAR') ? 'vk-key-wide' : '' }`;
      btn.tabIndex = 0; 
      btn.innerText = k;
      
      btn.onclick = (e) => {
        e.stopPropagation();
        handleVkPress(k);
      };

      btn.onkeydown = (e) => {
        if (e.key === "ArrowRight") {
          const isLastInRow = (index + 1) % 6 === 0 || index === vkKeys.length - 1;
          if (isLastInRow) {
            e.preventDefault();
            focusCardSafely(activeLocalIndex);
          }
        }
      };

      container.appendChild(btn);
    });
  }

  function handleVkPress(key) {
    const input = document.getElementById("menuSearchInput");
    if (key === 'ESPAÇO') input.value += ' ';
    else if (key === 'DEL') input.value = input.value.slice(0, -1);
    else if (key === 'LIMPAR') input.value = '';
    else input.value += key;
    filterCatalogByBrand(input.value);
  }

  function buildBrandList() {
    const brandContainer = document.getElementById("brandInlineList");
    brandContainer.innerHTML = "";
    const baseList = getBaseListForCurrentTab();
    const brands = [...new Set(baseList.map(c => c.brewery || c.Cervejaria).filter(Boolean))].sort();
    
    let defaultText = "TODAS AS MARCAS";
    if (currentTab === 'ococ') defaultText = "TODOS OS PAÍSES";
    if (currentTab === 'sets') defaultText = "TODOS OS SETS";

    const allBtn = document.createElement("button");
    allBtn.className = "brand-btn"; allBtn.tabIndex = 0; allBtn.innerText = defaultText;
    
    allBtn.onclick = (e) => { 
      e.stopPropagation();
      lastSelectedMenuId = 'menuBtnBrands';
      lastSelectedBrandElem = allBtn;
      document.getElementById("topBrandInput").value = "";
      filterCatalogByBrand(""); 
      focusCardSafely(0); 
    };

    allBtn.onkeydown = (e) => {
      if (e.key === "ArrowRight") {
        e.preventDefault();
        focusCardSafely(activeLocalIndex);
      }
    };

    brandContainer.appendChild(allBtn);

    brands.forEach(b => {
      const btn = document.createElement("button");
      btn.className = "brand-btn"; btn.tabIndex = 0; btn.innerText = String(b).toUpperCase();
      
      btn.onclick = (e) => { 
        e.stopPropagation();
        lastSelectedMenuId = 'menuBtnBrands';
        lastSelectedBrandElem = btn;
        document.getElementById("topBrandInput").value = b;
        filterCatalogByBrand(b); 
        focusCardSafely(0); 
      };

      btn.onkeydown = (e) => {
        if (e.key === "ArrowRight") {
          e.preventDefault();
          focusCardSafely(activeLocalIndex);
        }
      };

      brandContainer.appendChild(btn);
    });
  }

  /* FILTRA CATÁLOGO E ATUALIZA LOGO E WALLPAPER */
  function filterCatalogByBrand(query) {
    const val = query.toLowerCase().trim();
    const baseList = getBaseListForCurrentTab();

    currentFiltered = baseList.filter(can => {
      if (!val) return true;
      const b = String(can.brewery || can.Cervejaria || "").toLowerCase();
      return b.includes(val);
    });

    currentPage = 0;
    activeLocalIndex = 0;
    renderApp();
    updateCounter(0);
    updateBrandLogoHeader(query);
  }

/* ATUALIZA O LOGO E O WALLPAPER DA MARCA NO CANTO SUPERIOR */
  function updateBrandLogoHeader(brandQuery) {
    const logoContainer = document.getElementById("heroBrandLogo");
    const wallpaperElem = document.getElementById("heroBrandWallpaper");

    // Se o campo de busca estiver vazio, limpa logo e wallpaper
    if (!brandQuery || String(brandQuery).trim() === "") {
      logoContainer.innerHTML = "";
      if (wallpaperElem) {
        wallpaperElem.style.backgroundImage = "none";
        wallpaperElem.classList.remove("active");
      }
      return;
    }

    const queryLower = String(brandQuery).toLowerCase().trim();

    // 1. Procura a primeira latinha da marca para pegar o Logo
    const matchCan = canCatalog.find(c => {
      const b = String(c.brewery || c.Cervejaria || "").toLowerCase().trim();
      return b === queryLower || b.includes(queryLower);
    });

    if (matchCan) {
      // Exibe o Logo no canto direito
      const logoUrl = matchCan.brandLogo || matchCan.BRAND_LOGO;
      if (logoUrl && String(logoUrl).trim() !== "") {
        logoContainer.innerHTML = `<img src="${getOptimizedImageUrl(logoUrl, 400)}" alt="LOGO DA MARCA">`;
      } else {
        logoContainer.innerHTML = "";
      }

      // 2. Busca o brandWallpaper (Coluna Q) em QUALQUER latinha cadastrada da mesma marca
      let wallpaperUrl = "";

      // Filtra todas as latinhas que pertencem à marca buscada
      const sameBrandCans = canCatalog.filter(c => {
        const b = String(c.brewery || c.Cervejaria || "").toLowerCase().trim();
        return b === queryLower || b.includes(queryLower);
      });

      // Procura em qualquer uma dessas latinhas se existe um 'brandWallpaper' ou 'wallpaper' preenchido
      const canWithWallpaper = sameBrandCans.find(c => {
        const wp = c.brandWallpaper || c.wallpaper || c.BRANDWALLPAPER || c.WALLPAPER;
        return wp && String(wp).trim() !== "";
      });

      if (canWithWallpaper) {
        wallpaperUrl = canWithWallpaper.brandWallpaper || canWithWallpaper.wallpaper || canWithWallpaper.BRANDWALLPAPER || canWithWallpaper.WALLPAPER;
      } else {
        // FALLBACK: Se nenhuma latinha da marca tiver a coluna Q preenchida, usa o Logo ou a Capa da lata
        wallpaperUrl = matchCan.brandLogo || matchCan.BRAND_LOGO || matchCan.ImgCover || matchCan.cover;
      }

      // Aplica o Wallpaper encontrado no fundo
      if (wallpaperElem && wallpaperUrl && String(wallpaperUrl).trim() !== "") {
        const fullImgUrl = getOptimizedImageUrl(wallpaperUrl, 1200);
        wallpaperElem.style.backgroundImage = `url('${fullImgUrl}')`;
        wallpaperElem.classList.add("active");
      } else if (wallpaperElem) {
        wallpaperElem.style.backgroundImage = "none";
        wallpaperElem.classList.remove("active");
      }
    } else {
      logoContainer.innerHTML = "";
      if (wallpaperElem) {
        wallpaperElem.style.backgroundImage = "none";
        wallpaperElem.classList.remove("active");
      }
    }
  }

  /* LÓGICA DE AUTOCOMPLETE DO CAMPO SUPERIOR */
  const topBrandInput = document.getElementById("topBrandInput");
  const brandAutocompleteList = document.getElementById("brandAutocompleteList");

  topBrandInput.addEventListener("input", (e) => {
    const val = e.target.value.toLowerCase().trim();
    activeAutocompleteIndex = -1;

    if (!val) {
      closeAutocomplete();
      filterCatalogByBrand("");
      return;
    }

    const matches = registeredBrands.filter(b => b.toLowerCase().includes(val));
    renderAutocompleteDropdown(matches);
    filterCatalogByBrand(val);
  });

  topBrandInput.addEventListener("keydown", (e) => {
    const items = brandAutocompleteList.querySelectorAll(".autocomplete-item");

    if (e.key === "ArrowDown") {
      e.preventDefault();
      if (items.length > 0) {
        activeAutocompleteIndex = (activeAutocompleteIndex + 1) % items.length;
        updateAutocompleteFocus(items);
      } else {
        focusCardSafely(0);
      }
    } else if (e.key === "ArrowUp") {
      e.preventDefault();
      if (items.length > 0 && activeAutocompleteIndex > 0) {
        activeAutocompleteIndex--;
        updateAutocompleteFocus(items);
      }
    } else if (e.key === "Enter") {
      e.preventDefault();
      if (activeAutocompleteIndex >= 0 && items[activeAutocompleteIndex]) {
        selectBrandFromAutocomplete(items[activeAutocompleteIndex].innerText);
      } else {
        closeAutocomplete();
        focusCardSafely(0);
      }
    } else if (e.key === "Escape") {
      closeAutocomplete();
    }
  });

  function renderAutocompleteDropdown(matches) {
    brandAutocompleteList.innerHTML = "";
    if (matches.length === 0) {
      closeAutocomplete();
      return;
    }

    matches.forEach((brand, idx) => {
      const item = document.createElement("div");
      item.className = "autocomplete-item";
      item.innerText = brand.toUpperCase();
      item.onclick = (e) => {
        e.stopPropagation();
        selectBrandFromAutocomplete(brand);
      };
      brandAutocompleteList.appendChild(item);
    });

    brandAutocompleteList.classList.add("active");
  }

  function updateAutocompleteFocus(items) {
    items.forEach((item, idx) => {
      if (idx === activeAutocompleteIndex) {
        item.classList.add("active");
        item.scrollIntoView({ block: "nearest" });
      } else {
        item.classList.remove("active");
      }
    });
  }

  function selectBrandFromAutocomplete(brandName) {
    topBrandInput.value = brandName.toUpperCase();
    topBrandInput.blur();
    closeAutocomplete();
    filterCatalogByBrand(brandName);
    focusCardSafely(0);
  }

  function closeAutocomplete() {
    brandAutocompleteList.innerHTML = "";
    brandAutocompleteList.classList.remove("active");
    activeAutocompleteIndex = -1;
  }

  function updateCounter(localIndex) {
    const total = currentFiltered.length;
    const globalIndex = currentPage * cardsPerPage + localIndex;
    const currentNum = total > 0 ? (globalIndex + 1) : 0;
    
    const counterElem = document.getElementById("cardCounter");
    if (counterElem) {
      counterElem.innerText = `${currentNum}/${total}`;
    }

    const currentCan = currentFiltered[globalIndex];
    if (currentCan) {
      let rawPhotos = [];
      if (currentCan.images) rawPhotos = [currentCan.images.front, currentCan.images.left, currentCan.images.back, currentCan.images.right].filter(Boolean);
      if (rawPhotos.length === 0) rawPhotos = [currentCan.ImgFront, currentCan.ImgLeft, currentCan.ImgBack, currentCan.ImgRight].filter(Boolean);
      const logoUrl = currentCan.brandLogo || currentCan.BRAND_LOGO;
      if (rawPhotos.length === 0 && logoUrl) rawPhotos.push(logoUrl);
      zoomGallery = rawPhotos;

      if (!topBrandInput.value.trim() && logoUrl) {
        document.getElementById("heroBrandLogo").innerHTML = `<img src="${getOptimizedImageUrl(logoUrl, 400)}" alt="LOGO DA MARCA">`;
      }
    } else {
      zoomGallery = [];
    }
  }

  /* RENDERIZAÇÃO DOS CARDS (2 LINHAS DE 7) */
  function renderApp() {
    clearAllCardFocus();
    const row = document.getElementById("cardRow");
    row.innerHTML = "";

    const startIndex = currentPage * cardsPerPage;
    const pageItems = currentFiltered.slice(startIndex, startIndex + cardsPerPage);

    pageItems.forEach((can, localIndex) => {
      const globalIndex = startIndex + localIndex;

      const rawImg = can.ImgCover || can.cover || can.ImgFront || can.front || can.brandLogo;
      const frontImg = getOptimizedImageUrl(rawImg, 400);

      const brandRaw = can.brewery || can.Cervejaria || can.name || "Cerveja";
      const brandFormatted = formatCapitalizedText(brandRaw);

      const countryRaw = can.country || can.Pais || "";
      const countryFormatted = formatCapitalizedText(countryRaw);

      const volumeText = can.volume || can.Volume || "";
      const flagUrl = getFlagUrlByCountry(countryRaw);

      const brandKey = String(brandRaw).toLowerCase().trim();
      const cardColor = BRAND_COLORS[brandKey] || "#008234";

      const card = document.createElement("div");
      card.className = `card ${currentTab === 'sets' ? 'card-aspect-sets' : ''}`;
      card.tabIndex = 0;
      card.dataset.globalIndex = globalIndex;
      
      card.onmouseenter = () => {
        clearAllCardFocus();
        card.classList.add("focused");
        activeLocalIndex = localIndex;
        updateCounter(localIndex);
      };

      card.onfocus = () => {
        if (document.getElementById("zoomModal").classList.contains("active") || document.getElementById("exitModal").classList.contains("active")) return;
        clearAllCardFocus();
        card.classList.add("focused");
        activeLocalIndex = localIndex;
        updateCounter(localIndex);
      };
      
      card.onclick = (e) => {
        e.stopPropagation();
        openZoomModal(0);
      };

      card.onkeydown = (e) => {
        if (document.getElementById("zoomModal").classList.contains("active") || document.getElementById("exitModal").classList.contains("active")) return;

        if (e.key === "Enter" || e.key === " ") {
          e.preventDefault();
          openZoomModal(0);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          if (localIndex < pageItems.length - 1) {
            focusCardSafely(localIndex + 1);
          } else if ((startIndex + cardsPerPage) < currentFiltered.length) {
            currentPage++;
            renderApp();
            focusCardSafely(0);
          }
        } else if (e.key === "ArrowLeft") {
          e.preventDefault();
          if (localIndex > 0) {
            focusCardSafely(localIndex - 1);
          } else if (currentPage > 0) {
            currentPage--;
            renderApp();
            focusCardSafely(cardsPerPage - 1);
          } else {
            clearAllCardFocus();
            openMenu();
          }
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          if (localIndex < cardsPerRow) {
            if (localIndex + cardsPerRow < pageItems.length) {
              focusCardSafely(localIndex + cardsPerRow);
            }
          } else if ((startIndex + cardsPerPage) < currentFiltered.length) {
            currentPage++;
            renderApp();
            focusCardSafely(localIndex % cardsPerRow);
          }
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          if (localIndex >= cardsPerRow) {
            focusCardSafely(localIndex - cardsPerRow);
          } else if (currentPage > 0) {
            currentPage--;
            renderApp();
            const target = cardsPerRow + localIndex;
            focusCardSafely(target);
          } else {
            clearAllCardFocus();
            topBrandInput.focus();
            topBrandInput.classList.add("focused");
          }
        }
      };

      card.innerHTML = `
        <div class="card-top-photo">
          <img src="${frontImg}" alt="${brandFormatted}" loading="lazy">
        </div>
        <div class="card-bottom-bar" style="background-color: ${cardColor};">
          <div class="card-bar-title">${brandFormatted}</div>
          <div class="card-bar-details">
            <div class="card-bar-country">
              ${flagUrl ? `<img src="${flagUrl}" class="card-bar-flag" alt="${countryFormatted}">` : ''}
              <span>${countryFormatted}</span>
            </div>
            ${volumeText ? `<div class="card-bar-vol">${volumeText}</div>` : ''}
          </div>
        </div>
      `;

      row.appendChild(card);
    });
  }

  /* SISTEMA DE ZOOM CICLICO E PAN */
  function openZoomModal(index) {
    if (!zoomGallery || zoomGallery.length === 0) return;
    currentZoomIndex = index;
    resetZoomTransform();
    const imgElem = document.getElementById("zoomImage");
    imgElem.src = getOptimizedImageUrl(zoomGallery[currentZoomIndex], 1200);
    document.getElementById("zoomModal").classList.add("active");
  }

  function resetZoomTransform() {
    zoomState = 0;
    zoomLevel = 1.0;
    panX = 0;
    panY = 0;
    applyZoomTransform();
  }

  function applyZoomTransform() {
    const imgElem = document.getElementById("zoomImage");
    if (imgElem) {
      imgElem.style.transform = `translate(${panX}px, ${panY}px) scale(${zoomLevel})`;
    }
  }

  function toggleZoomStep() {
    zoomState = (zoomState + 1) % 4;

    if (zoomState === 0) {
      zoomLevel = 1.0;
      panX = 0;
      panY = 0;
    } else if (zoomState === 1) {
      zoomLevel = 1.5;
    } else if (zoomState === 2) {
      zoomLevel = 3.0;
    } else if (zoomState === 3) {
      zoomLevel = 1.5;
    }

    applyZoomTransform();
  }

  function navigateZoom(direction) {
    if (!zoomGallery || zoomGallery.length === 0) return;
    currentZoomIndex = (currentZoomIndex + direction + zoomGallery.length) % zoomGallery.length;
    resetZoomTransform();
    const imgElem = document.getElementById("zoomImage");
    imgElem.src = getOptimizedImageUrl(zoomGallery[currentZoomIndex], 1200);
  }

  function closeZoomModal() {
    resetZoomTransform();
    document.getElementById("zoomModal").classList.remove("active");
    focusCardSafely(activeLocalIndex);
  }

  /* CONFIRMAÇÃO DE SAÍDA */
  function openExitModal() {
    closeMenu();
    document.getElementById("exitModal").classList.add("active");
    document.getElementById("exitBtnNo").focus();
  }

  function closeExitModal() {
    document.getElementById("exitModal").classList.remove("active");
    focusCardSafely(activeLocalIndex);
  }

  function confirmExit() {
    if (typeof PonteAndroid !== "undefined") {
      PonteAndroid.fecharApp();
    } else if (window.navigator && window.navigator.app && window.navigator.app.exitApp) {
      window.navigator.app.exitApp();
    } else if (window.device && window.device.exitApp) {
      window.device.exitApp();
    } else {
      window.close();
    }
  }

  /* GESTOS SWIPE */
  let touchStartX = 0;
  let touchStartY = 0;

  const catalogSection = document.getElementById("catalogSection");

  catalogSection.addEventListener("touchstart", (e) => {
    touchStartX = e.changedTouches[0].screenX;
    touchStartY = e.changedTouches[0].screenY;
  }, { passive: true });

  catalogSection.addEventListener("touchend", (e) => {
    const touchEndX = e.changedTouches[0].screenX;
    const touchEndY = e.changedTouches[0].screenY;
    handleSwipe(touchStartX, touchStartY, touchEndX, touchEndY);
  }, { passive: true });

  /* SCROLL DO MOUSE */
  catalogSection.addEventListener("wheel", (e) => {
    if (e.deltaY > 0) {
      if (((currentPage + 1) * cardsPerPage) < currentFiltered.length) {
        currentPage++;
        renderApp();
        focusCardSafely(activeLocalIndex);
      }
    } else if (e.deltaY < 0) {
      if (currentPage > 0) {
        currentPage--;
        renderApp();
        focusCardSafely(activeLocalIndex);
      }
    }
  }, { passive: true });

  function handleSwipe(startX, startY, endX, endY) {
    const diffX = endX - startX;
    const diffY = endY - startY;
    const threshold = 30;

    if (Math.abs(diffY) > Math.abs(diffX)) {
      if (diffY < -threshold) {
        if (((currentPage + 1) * cardsPerPage) < currentFiltered.length) {
          currentPage++;
          renderApp();
          focusCardSafely(activeLocalIndex);
        }
      } else if (diffY > threshold) {
        if (currentPage > 0) {
          currentPage--;
          renderApp();
          focusCardSafely(activeLocalIndex);
        }
      }
    } else {
      if (diffX < -threshold) {
        const cards = document.querySelectorAll(".card");
        if (activeLocalIndex < cards.length - 1) {
          focusCardSafely(activeLocalIndex + 1);
        } else if (((currentPage + 1) * cardsPerPage) < currentFiltered.length) {
          currentPage++;
          renderApp();
          focusCardSafely(0);
        }
      } else if (diffX > threshold) {
        if (activeLocalIndex > 0) {
          focusCardSafely(activeLocalIndex - 1);
        } else if (currentPage > 0) {
          currentPage--;
          renderApp();
          focusCardSafely(cardsPerPage - 1);
        }
      }
    }
  }

  /* NAVEGAÇÃO DO BOTÃO DE ORDENAÇÃO VIA TECLADO */
  const sortBtnElem = document.getElementById("sortOrderBtn");
  sortBtnElem.onkeydown = (e) => {
    if (e.key === "Enter" || e.key === " ") {
      e.preventDefault();
      toggleSortOrder();
    } else if (e.key === "ArrowDown") {
      e.preventDefault();
      focusCardSafely(0);
    } else if (e.key === "ArrowLeft") {
      e.preventDefault();
      openMenu();
    }
  };

  /* TECLADO E CONTROLE REMOTO */
  document.addEventListener("keydown", (e) => {
    const isZoomActive = document.getElementById("zoomModal").classList.contains("active");
    const isExitActive = document.getElementById("exitModal").classList.contains("active");
    const isMenuOpen = document.getElementById("sidebarDrawer").classList.contains("open");

    if (isZoomActive) {
      if (e.key === "Enter" || e.key === " " || e.keyCode === 13) {
        e.preventDefault();
        toggleZoomStep();
      } else if (zoomLevel > 1.0) {
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          panX += PAN_STEP;
          applyZoomTransform();
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          panX -= PAN_STEP;
          applyZoomTransform();
        } else if (e.key === "ArrowUp") {
          e.preventDefault();
          panY += PAN_STEP;
          applyZoomTransform();
        } else if (e.key === "ArrowDown") {
          e.preventDefault();
          panY -= PAN_STEP;
          applyZoomTransform();
        } else if (e.key === "Escape" || e.key === "Back" || e.keyCode === 10009 || e.keyCode === 27) {
          e.preventDefault();
          closeZoomModal();
        }
      } else {
        if (e.key === "ArrowLeft") {
          e.preventDefault();
          navigateZoom(-1);
        } else if (e.key === "ArrowRight") {
          e.preventDefault();
          navigateZoom(1);
        } else if (e.key === "ArrowUp" || e.key === "ArrowDown" || e.key === "Escape" || e.key === "Back" || e.keyCode === 10009 || e.keyCode === 27) {
          e.preventDefault();
          closeZoomModal();
        }
      }
    } else if (isExitActive) {
      if (e.key === "ArrowLeft" || e.key === "ArrowRight") {
        e.preventDefault();
        const active = document.activeElement;
        const btnNo = document.getElementById("exitBtnNo");
        const btnYes = document.getElementById("exitBtnYes");
        if (active === btnNo) btnYes.focus();
        else btnNo.focus();
      } else if (e.key === "Escape" || e.key === "Back" || e.keyCode === 10009 || e.keyCode === 27) {
        e.preventDefault();
        closeExitModal();
      }
    } else {
      if (e.key === "Escape" || e.key === "Back" || e.keyCode === 10009 || e.keyCode === 27) {
        e.preventDefault();
        if (isMenuOpen) {
          closeMenu();
          focusCardSafely(activeLocalIndex);
        } else {
          openExitModal();
        }
      }

      const activeElem = document.activeElement;
      if (activeElem && (activeElem.classList.contains("cat-btn") || activeElem.classList.contains("brand-btn")) && e.key === "ArrowRight") {
        e.preventDefault();
        focusCardSafely(activeLocalIndex);
      }
    }
  }, true);

  window.onload = fetchCatalogFromSheet;
</script>
